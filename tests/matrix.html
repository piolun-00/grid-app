<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>grid.app — testy siatki</title>
<style>
  :root { --bg: #F4F4F2; --panel: #FFF; --fg: #111; --muted: #77776F; --line: #E2E2DD;
          --ok: #1A7F37; --fail: #C62D1F; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
         font: 500 13px/1.45 system-ui, -apple-system, sans-serif; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
          padding: 16px; margin-bottom: 12px; max-width: 900px; }
  .card h2 { font-size: 13px; font-weight: 500; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 5px 0;
         border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); font-weight: 700; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  #summary { font-size: 15px; padding: 12px 16px; border-radius: 2px; max-width: 900px;
             margin-bottom: 16px; }
  #summary.pass { background: #E8F5EC; color: var(--ok); }
  #summary.fails { background: #FBEAE8; color: var(--fail); }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--bg); padding: 8px; overflow: auto; font-size: 11px; margin: 6px 0 0; }
  iframe { position: fixed; left: -9999px; width: 1440px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1>grid.app — testy siatki</h1>
<p class="lead">
  Otwórz tę stronę z tego samego serwera co aplikację. Testy ładują
  <code>../index.html</code> w ukrytej ramce i sprawdzają liczenie siatki.
  Zapis projektów jest w nich wyłączony, więc nie ruszają Twoich danych.
</p>
<div id="summary">Ładowanie aplikacji…</div>
<div id="out"></div>
<iframe id="app" title="aplikacja pod testem"></iframe>

<script>
/* Wzorzec dla trybu „interlinia": skrót z 128 wyeksportowanych SVG.
   Zmiana tej wartości jest dozwolona TYLKO razem ze świadomą zmianą
   geometrii eksportu. Nowy skrót wypisuje się poniżej przy niezgodności. */
const WZORZEC = '88382174ac52c8a7fe01125c35d0a936b0d91890a24dc4c78e6e4058ec865c22';

const out = document.getElementById('out');
const summary = document.getElementById('summary');
let bledy = 0, wszystkich = 0;

function karta(tytul) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<h2></h2>';
  d.firstChild.textContent = tytul;
  out.appendChild(d);
  return d;
}
function wynik(karta, nazwa, zdane, szczegol = '') {
  wszystkich++; if (!zdane) bledy++;
  const r = document.createElement('div');
  r.className = 'row';
  const a = document.createElement('span');
  a.textContent = nazwa;
  const b = document.createElement('span');
  b.className = (zdane ? 'ok' : 'fail') + ' mono';
  b.textContent = (zdane ? 'OK' : 'BŁĄD') + (szczegol ? '  ' + szczegol : '');
  r.append(a, b);
  karta.appendChild(r);
}
const bliskie = (a, b, eps = 1e-9) => Math.abs(a - b) < eps;

async function sha(tekst, alg = 'SHA-1', bajtow = 6) {
  const h = await crypto.subtle.digest(alg, new TextEncoder().encode(tekst));
  const arr = [...new Uint8Array(h)];
  return (bajtow ? arr.slice(0, bajtow) : arr).map(x => x.toString(16).padStart(2, '0')).join('');
}

const ramka = document.getElementById('app');
/* Adres z przełamaniem pamięci podręcznej: bez tego ramka potrafi dostać
   starą kopię aplikacji i testy przechodzą mimo zmian w kodzie.
   Wyszło przy próbie celowego zepsucia liczenia — testy nic nie zauważyły. */
ramka.src = '../index.html?test=' + Date.now();

function czekajNaAplikacje() {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const sprawdz = () => {
      const w = ramka.contentWindow, d = ramka.contentDocument;
      if (w && typeof w.computeGrid === 'function' && typeof w.downloadSVG === 'function'
          && d.querySelectorAll('#resultsTable .result-row').length > 0) return resolve(w);
      if (Date.now() - start > 20000) return reject(new Error('aplikacja nie wstała w 20 s'));
      setTimeout(sprawdz, 120);
    };
    ramka.addEventListener('load', sprawdz, { once: true });
    sprawdz();
  });
}

async function uruchom() {
  let w;
  try { w = await czekajNaAplikacje(); }
  catch (e) {
    summary.className = 'fails';
    summary.textContent = 'Nie udało się wczytać aplikacji: ' + e.message;
    return;
  }

  // Testy nie mogą zapisywać projektów użytkownika ani pobierać plików.
  w.persistProject = async () => {};
  w.URL.createObjectURL = b => { w.__blob = b; return 'blob:test'; };
  w.URL.revokeObjectURL = () => {};
  w.HTMLAnchorElement.prototype.click = function () {};

  const d = ramka.contentDocument;
  const set = (id, v) => { const e = d.getElementById(id); if (e) e.value = v; };
  const pill = (g, v) => { const b = d.querySelector(`#${g} [data-value="${v}"]`); if (b) b.click(); };
  const ustaw = o => {
    pill('unitToggle', o.u); pill('facingToggle', o.f);
    set('pageWidth', o.w); set('pageHeight', o.h);
    set('marginTop', o.mt); set('marginBottom', o.mb);
    set('marginLeft', o.ml); set('marginRight', o.mr);
    set('fontSize', o.fs); set('lineHeight', o.lh);
    set('hModules', o.mod); set('columns', o.col); set('gutterWidth', o.g ?? '');
    d.getElementById('firstHeightMode').value = o.fh || 'leading';
    d.getElementById('showGuides').checked = !!o.guides;
    d.getElementById('showSpecimen').checked = !!o.spec;
    w.recalcAndDraw();
  };
  const BAZA = { u: 'mm', f: 'single', w: '210.00', h: '297.00', mt: '12.00', mb: '18.00',
                 ml: '15.00', mr: '9.00', fs: '8.00', lh: '1.20', mod: '1', col: '1' };

  /* ——— 1. Niezmienniki ——— */
  const k1 = karta('Niezmienniki geometrii (niezależne od wyglądu)');
  for (const fh of ['leading', 'xheight', 'capheight']) {
    for (const [opis, nad] of [['A4 1 kol.', {}],
                               ['B5 2 kol. 3 moduły', { w: '176.00', h: '250.00', col: '2', mod: '3' }],
                               ['duży stopień', { fs: '24.00', lh: '1.45' }],
                               ['px', { u: 'px', w: '800.00', h: '1200.00' }]]) {
      ustaw({ ...BAZA, ...nad, fh });
      const p = w.readGridInputs(), g = w.computeGrid(p);
      const etykieta = `${fh} · ${opis}`;
      wynik(k1, `${etykieta} — równanie się domyka`,
        bliskie(g.firstGap + (g.nRows - 1) * g.baselineSpacing, g.availableHeight, 1e-9));
      wynik(k1, `${etykieta} — ostatnia linia na dolnym marginesie`,
        bliskie(g.rowY[g.nRows], g.availableHeight, 1e-9));
      wynik(k1, `${etykieta} — linie rosnące, ${g.nRows + 1} pozycji`,
        g.rowY.length === g.nRows + 1 && g.rowY.every((v, i, a) => i === 0 || v > a[i - 1]));
      wynik(k1, `${etykieta} — wysokości wierszy dodatnie`,
        g.rowH.length === g.nRows && g.rowH.every(v => v > 0));
      wynik(k1, `${etykieta} — kolumny wypełniają szerokość`,
        bliskie(g.nColumns * g.columnWidth + (g.nColumns - 1) * g.gutterSpacing, g.availableWidth, 1e-9));
      if (fh === 'leading') {
        wynik(k1, `${etykieta} — siatka jednorodna`, bliskie(g.firstGap, g.baselineSpacing, 1e-12));
      } else {
        wynik(k1, `${etykieta} — pierwsza wysokość mniejsza od interlinii`,
          g.firstGap < g.baselineSpacing);
      }
    }
  }

  /* ——— 2. Matryca eksportu ——— */
  const k2 = karta('Eksport SVG — matryca 128 przypadków, tryb „interlinia"');
  const skroty = [];
  for (const u of ['mm', 'px'])
    for (const f of ['single', 'spread'])
      for (const fs of ['8.00', '11.00'])
        for (const lh of ['1.20', '1.45'])
          for (const mod of ['', '1', '3', '4'])
            for (const col of ['', '5']) {
              ustaw({ ...BAZA, u, f, fs, lh, mod, col, fh: 'leading' });
              w.downloadSVG();
              const svg = w.__blob ? await w.__blob.text() : 'BRAK';
              skroty.push(await sha(svg));
            }
  const policzony = await sha(skroty.join(' '), 'SHA-256', 0);
  wynik(k2, `wygenerowano ${skroty.length} eksportów`, skroty.length === 128);
  wynik(k2, 'skrót zgodny ze wzorcem', policzony === WZORZEC);
  if (policzony !== WZORZEC) {
    const det = document.createElement('details');
    det.innerHTML = '<summary>Skrót się różni — geometria eksportu się zmieniła</summary>' +
      '<pre>wzorzec:   ' + WZORZEC + '\npoliczony: ' + policzony +
      '\n\nJeśli zmiana była zamierzona, wstaw nowy skrót w stałej WZORZEC.</pre>';
    k2.appendChild(det);
  }

  /* ——— 3. Tryby zmieniają wynik ——— */
  const k3 = karta('Tryby pierwszej wysokości dają różne siatki');
  const geo = {};
  for (const fh of ['leading', 'xheight', 'capheight']) {
    ustaw({ ...BAZA, fs: '12.00', lh: '1.30', fh });
    const g = w.computeGrid(w.readGridInputs());
    geo[fh] = { pierwsza: +g.firstGap.toFixed(6), interlinia: +g.baselineSpacing.toFixed(6) };
  }
  wynik(k3, 'X różni się od interlinii', geo.xheight.pierwsza !== geo.leading.pierwsza,
    `${geo.xheight.pierwsza} vs ${geo.leading.pierwsza}`);
  wynik(k3, 'wersalik różni się od X', geo.capheight.pierwsza !== geo.xheight.pierwsza,
    `${geo.capheight.pierwsza} vs ${geo.xheight.pierwsza}`);
  wynik(k3, 'wersalik wyższy od X', geo.capheight.pierwsza > geo.xheight.pierwsza);

  summary.className = bledy ? 'fails' : 'pass';
  summary.textContent = bledy
    ? `${bledy} z ${wszystkich} testów nie przeszło`
    : `Wszystkie ${wszystkich} testów przeszło`;
}

uruchom();
</script>
</body>
</html>
