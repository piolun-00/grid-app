<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Gerstner Grid – Poprzednie ustawienie (dynamiczna skala w JS)</title>
  <style>
    /* Cały dokument nie przewija się – overflow ukryty */
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    /* Ładujemy font OCR-X Regular z folderu Typefaces */
    @font-face {
      font-family: 'OCR-X Regular';
      src: url('Typefaces/OCR-X Regular.woff2') format('woff2'),
           url('Typefaces/OCR-X Regular.woff') format('woff'),
           url('Typefaces/OCR-X Regular.ttf') format('truetype'),
           url('Typefaces/OCR-X Regular.otf') format('opentype'),
           url('Typefaces/OCR-X Regular.svg#OCR-XRegular') format('svg');
      font-weight: normal;
      font-style: normal;
    }
    /* Globalne ustawienia – tło białe */
    body {
      font-family: 'OCR-X Regular', sans-serif;
      background: #fff;
      color: #000;
      font-size: 14px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      display: flex;
      flex-direction: row;
      height: 100vh;
      margin: 0;
    }
    /* Panel Parametry – 20svw, padding 20px, wewnętrzny scroll */
    .controls {
      flex: 0 0 20svw;
      min-width: 200px;
      padding: 20px;
      background: #f5f5f5;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .controls h2 {
      margin: 0 0 20px 0;
      font-size: 32px;
    }
    .controls label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .controls input,
    .controls select {
      width: 100%;
      margin-bottom: 16px;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      box-sizing: border-box;
      font-size: 14px;
      font-family: 'OCR-X Regular', sans-serif;
    }
    /* Minimalne wartości dla pól liczbowych:
       - Szerokość, wysokość, marginesy, odstępy, liczba kolumn – min="0"
       - Wielkość fontu – min="1"
       - Interlinia – min="0.1"  */
    
    /* Przyciski – domyślny styl przycisków */
    .controls button {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
      font-family: 'OCR-X Regular', sans-serif;
      transition: background 0.3s;
    }
    .controls button:hover {
      background: #ddd;
      cursor: pointer;
    }
    /* Styl przycisku "Pobierz siatkę" */
    .download-button {
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-family: 'OCR-X Regular', sans-serif;
      border: 1px solid #ccc;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, border 0.3s;
      width: 100%;
      box-sizing: border-box;
    }
    .download-button:hover {
      background: #f0f0f0;
      border-color: #bbb;
    }
    body.dark-mode .download-button {
      background: #333;
      border: 1px solid #444;
      color: #eee;
    }
    body.dark-mode .download-button:hover {
      background: #444;
      border-color: #555;
    }
    /* Sekcja wizualizacji – pozostałe panele pozostają na miejscu */
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      margin: 32px;
      padding: 40px 32px 40px 40px;
      background: #fff;
      overflow: hidden;
    }
    canvas {
      background: #fff;
      border: 1px solid #ccc;
    }
    /* Panel ustawień gridu (wyniki) – pozostaje na miejscu */
    .results-panel {
      flex: 0 0 20svw;
      min-width: 200px;
      padding: 20px;
      background: #fafafa;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
      overflow: hidden;
    }
    .results-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: #000;
      margin: 0;
      padding: 0;
    }
    .results-panel th,
    .results-panel td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }
    .results-panel tbody tr:nth-child(odd) {
      background: #F9F9F9;
    }
    .results-panel tbody tr:nth-child(even) {
      background: #E5E5E5;
    }
    .results-panel th {
      font-size: 32px;
      border: none;
    }
    /* Stylowanie przełącznika trybu ciemnego – zachowujemy poprzedni wygląd */
    .toggle-container {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }
    .toggle-container label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #C8D5BB;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    /* Stopka – wewnątrz panelu parametrów, poniżej przełącznika */
    .footer {
      margin-top: 10px;
      font-family: 'OCR-X Regular', sans-serif;
      font-size: 14px;
      text-align: left;
      color: inherit;
    }
    .footer a {
      text-decoration: underline;
      color: inherit;
    }
    /* Tryb ciemny */
    body.dark-mode {
      background: #111;
      color: #fff;
    }
    body.dark-mode .controls {
      background: #222;
      border-right: 1px solid #333;
    }
    body.dark-mode .controls input,
    body.dark-mode .controls select,
    body.dark-mode .controls button {
      background: #333;
      border: 1px solid #444;
      color: #fff;
    }
    body.dark-mode .controls button:hover {
      background: #555;
    }
    body.dark-mode .results-panel {
      background: #222;
      border-right: 1px solid #333;
    }
    body.dark-mode .results-panel table {
      color: #eee;
    }
    body.dark-mode .results-panel th,
    body.dark-mode .results-panel td {
      border-bottom: 1px solid #444;
    }
    body.dark-mode .results-panel tbody tr:nth-child(odd) {
      background: #333;
    }
    body.dark-mode .results-panel tbody tr:nth-child(even) {
      background: #2a2a2a;
    }
    body.dark-mode .toggle-container {
      border-top: 1px solid #333;
    }
    body.dark-mode .canvas-container {
      background: #111;
    }
    body.dark-mode .footer {
      background: #222;
      color: #fff;
    }
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      .controls, .results-panel, .canvas-container {
        flex: none;
        width: 100%;
      }
      .controls, .results-panel, .canvas-container {
        padding: 10px;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Panel Parametry – jedyny scrollowany pionowo -->
    <div class="controls">
      <h2>Parametry</h2>
      <label>Jednostka:</label>
      <select id="unit">
        <option value="mm">mm</option>
        <option value="px">px</option>
      </select>
      <label>Szerokość strony:</label>
      <input type="number" id="pageWidth" value="210" min="0" />
      <label>Wysokość strony:</label>
      <input type="number" id="pageHeight" value="297" min="0" />
      <label>Margines górny:</label>
      <input type="number" id="marginTop" value="5" min="0" />
      <label>Margines dolny:</label>
      <input type="number" id="marginBottom" value="5" min="0" />
      <label>Margines lewy:</label>
      <input type="number" id="marginLeft" value="5" min="0" />
      <label>Margines prawy:</label>
      <input type="number" id="marginRight" value="5" min="0" />
      <label>Wielkość fontu (pt) – stała:</label>
      <input type="number" id="fontSize" value="8" min="1" />
      <label>Współczynnik interlinii:</label>
      <input type="number" step="0.1" id="lineHeight" value="1.2" min="0.1" />
      <!-- W miejscu wpisania liczby kolumn domyślna wartość to 4 (dla fontu ≤ 8) -->
      <label>Liczba kolumn (opcjonalnie):</label>
      <input type="number" id="columns" placeholder="np. 4" min="1" />
      <label>Odstęp między kolumnami:</label>
      <input type="number" id="gutter" value="5" min="0" />
      <!-- Przycisk "Przelicz i rysuj" z marginesem dolnym 12px -->
      <button id="recalc" class="reset-button" style="margin-bottom:12px;">Przelicz i rysuj</button>
      <button id="reset" class="reset-button">Reset</button>
      <div class="toggle-container">
        <label>
          Tryb ciemny
          <div class="toggle-switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>
          </div>
        </label>
      </div>
      <!-- Stopka -->
      <div class="footer">
        <p>WGC©2025 Designed by Radek Prośniak <a href="https://www.instagram.com/khorei.studio/" target="_blank">KHOREI</a></p>
      </div>
    </div>
    <!-- Panel Ustawienie gridu (wyniki) – pozostaje w miejscu -->
    <div class="results-panel" id="results">
      <!-- Tabela wyników pojawi się tutaj, a pod nią przycisk "Pobierz siatkę" -->
    </div>
    <!-- Sekcja wizualizacji (Canvas) – pozostaje w miejscu -->
    <div class="canvas-container" id="visContainer">
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>
  <script>
    let manualTheme = false;
    
    function updateTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').checked = true;
      } else {
        document.body.classList.remove('dark-mode');
        document.getElementById('darkModeToggle').checked = false;
      }
    }
    
    // Funkcja wykrywająca systemowy tryb kolorystyczny
    function detectSystemTheme() {
      if (window.matchMedia) {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        // Ustaw motyw na podstawie systemowego ustawienia przy starcie, o ile użytkownik nie zmienił ręcznie
        if (!manualTheme) {
          updateTheme(mq.matches ? 'dark' : 'light');
        }
        if (mq.addEventListener) {
          mq.addEventListener('change', e => {
            if (!manualTheme) {
              updateTheme(e.matches ? 'dark' : 'light');
            }
          });
        } else if (mq.addListener) {
          mq.addListener(e => {
            if (!manualTheme) {
              updateTheme(e.matches ? 'dark' : 'light');
            }
          });
        }
      }
    }
    
    // Wywołujemy wykrywanie motywu przy starcie
    window.addEventListener('load', () => {
      detectSystemTheme();
      recalcAndDraw();
    });
    
    document.getElementById('darkModeToggle').addEventListener('change', function() {
      manualTheme = true;
      const newTheme = this.checked ? 'dark' : 'light';
      updateTheme(newTheme);
      saveState();
    });
    
    // Zapobiegamy wpisywaniu ujemnych wartości – przy każdej zmianie przywracamy minimalne
    document.querySelectorAll('input[type="number"]').forEach(input => {
      input.addEventListener('input', function() {
        const min = parseFloat(this.getAttribute('min')) || 0;
        let current = parseFloat(this.value);
        if (isNaN(current) || current < min) {
          this.value = min;
          recalcAndDraw();
          saveState();
        }
      });
    });
    
    // Funkcje zapisu i odczytu stanu aplikacji
    function saveState() {
      const state = {
        unit: document.getElementById('unit').value,
        pageWidth: document.getElementById('pageWidth').value,
        pageHeight: document.getElementById('pageHeight').value,
        marginTop: document.getElementById('marginTop').value,
        marginBottom: document.getElementById('marginBottom').value,
        marginLeft: document.getElementById('marginLeft').value,
        marginRight: document.getElementById('marginRight').value,
        fontSize: document.getElementById('fontSize').value,
        lineHeight: document.getElementById('lineHeight').value,
        columns: document.getElementById('columns').value,
        gutter: document.getElementById('gutter').value,
        darkMode: document.getElementById('darkModeToggle').checked
      };
      localStorage.setItem('gridApp_state', JSON.stringify(state));
    }
    
    function loadState() {
      const saved = localStorage.getItem('gridApp_state');
      if (saved) {
        const state = JSON.parse(saved);
        if (state.unit) document.getElementById('unit').value = state.unit;
        if (state.pageWidth) document.getElementById('pageWidth').value = state.pageWidth;
        if (state.pageHeight) document.getElementById('pageHeight').value = state.pageHeight;
        if (state.marginTop) document.getElementById('marginTop').value = state.marginTop;
        if (state.marginBottom) document.getElementById('marginBottom').value = state.marginBottom;
        if (state.marginLeft) document.getElementById('marginLeft').value = state.marginLeft;
        if (state.marginRight) document.getElementById('marginRight').value = state.marginRight;
        if (state.fontSize) document.getElementById('fontSize').value = state.fontSize;
        if (state.lineHeight) document.getElementById('lineHeight').value = state.lineHeight;
        if (state.columns) document.getElementById('columns').value = state.columns;
        if (state.gutter) document.getElementById('gutter').value = state.gutter;
        if (typeof state.darkMode === 'boolean') {
          document.getElementById('darkModeToggle').checked = state.darkMode;
          updateTheme(state.darkMode ? 'dark' : 'light');
        }
      }
    }
    
    loadState();
    
    // Funkcja wyliczająca liczbę kolumn
    function computeColumns(availableWidth, fontSizeConverted, columnsInput) {
      let nColumns;
      if (columnsInput !== "") {
        nColumns = Math.max(parseInt(columnsInput), 1);
      } else {
        if (parseFloat(document.getElementById('fontSize').value) <= 8) {
          nColumns = 4;
        } else {
          nColumns = Math.floor(availableWidth / (fontSizeConverted * 5));
          nColumns = Math.max(nColumns, 1);
        }
        document.getElementById('columns').value = nColumns;
      }
      return nColumns;
    }
    
    // Funkcja rysująca i skalująca canvas (pełna siatka)
    function recalcAndDraw() {
      const unit = document.getElementById('unit').value;
      const conversionFactor = (unit === "mm") ? 0.3528 : 1.3333;
    
      const pageWidth = parseFloat(document.getElementById('pageWidth').value);
      const pageHeight = parseFloat(document.getElementById('pageHeight').value);
      const marginTop = parseFloat(document.getElementById('marginTop').value);
      const marginBottom = parseFloat(document.getElementById('marginBottom').value);
      const marginLeft = parseFloat(document.getElementById('marginLeft').value);
      const marginRight = parseFloat(document.getElementById('marginRight').value);
      const fixedFontSizePt = parseFloat(document.getElementById('fontSize').value);
      const lineHeightMult = parseFloat(document.getElementById('lineHeight').value);
      const columnsInput = document.getElementById('columns').value;
      const gutterSpacing = parseFloat(document.getElementById('gutter').value);
    
      const fontSizeConverted = fixedFontSizePt * conversionFactor;
      const availableWidthVal = pageWidth - (marginLeft + marginRight);
      const availableHeight = pageHeight - (marginTop + marginBottom);
    
      let nRows = Math.floor( availableHeight / (fontSizeConverted * lineHeightMult) );
      if (nRows < 1) nRows = 1;
      const optimalBaselineSpacing = availableHeight / nRows;
      const optimalBaselineSpacingPt = optimalBaselineSpacing / conversionFactor;
    
      let nColumns = computeColumns(availableWidthVal, fontSizeConverted, columnsInput);
    
      const totalGutter = (nColumns - 1) * gutterSpacing;
      const columnWidth = (availableWidthVal - totalGutter) / nColumns;
    
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
        <table>
          <thead>
            <tr><th colspan="2">Grid:</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>Liczba wierszy (baseline):</td>
              <td>${nRows}</td>
            </tr>
            <tr>
              <td>Font:</td>
              <td>${fixedFontSizePt} pt (${fontSizeConverted.toFixed(2)} ${unit})</td>
            </tr>
            <tr>
              <td>Interlinia:</td>
              <td>${optimalBaselineSpacingPt.toFixed(2)} pt (${optimalBaselineSpacing.toFixed(2)} ${unit})</td>
            </tr>
            <tr>
              <td>Liczba kolumn:</td>
              <td>${nColumns}</td>
            </tr>
            <tr>
              <td>Szerokość kolumny:</td>
              <td>${columnWidth.toFixed(2)} ${unit}</td>
            </tr>
            <tr>
              <td>Odstęp między kolumnami:</td>
              <td>${gutterSpacing.toFixed(2)} ${unit}</td>
            </tr>
            <tr>
              <td>Rozmiar strony:</td>
              <td>${pageWidth} ${unit} x ${pageHeight} ${unit}</td>
            </tr>
            <tr>
              <td>Marginesy pionowe:</td>
              <td>Top: ${marginTop.toFixed(2)} ${unit}<br>Bottom: ${marginBottom.toFixed(2)} ${unit}</td>
            </tr>
            <tr>
              <td>Marginesy poziome:</td>
              <td>Left: ${marginLeft.toFixed(2)} ${unit}<br>Right: ${marginRight.toFixed(2)} ${unit}</td>
            </tr>
          </tbody>
        </table>
        <button class="download-button" id="downloadSVG">Pobierz siatkę</button>`;
    
      document.getElementById('downloadSVG').addEventListener('click', downloadSVG);
    
      const canvas = document.getElementById('gridCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.querySelector('.canvas-container');
      const containerStyle = getComputedStyle(container);
      const paddingLeft = parseFloat(containerStyle.paddingLeft);
      const paddingRight = parseFloat(containerStyle.paddingRight);
      const paddingTop = parseFloat(containerStyle.paddingTop);
      const paddingBottom = parseFloat(containerStyle.paddingBottom);
      const contentWidth = container.clientWidth - paddingLeft - paddingRight;
      const contentHeight = container.clientHeight - paddingTop - paddingBottom;
    
      const scale = Math.min(contentWidth / pageWidth, contentHeight / pageHeight);
    
      canvas.width = pageWidth * scale;
      canvas.height = pageHeight * scale;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    
      ctx.save();
      ctx.scale(scale, scale);
    
      // Tło – ustawione na #fff
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, pageWidth, pageHeight);
    
      // Obrys całej strony
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1 / scale;
      ctx.strokeRect(0, 0, pageWidth, pageHeight);
    
      // Ramka marginesów
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1 / scale;
      ctx.strokeRect(marginLeft, marginTop, availableWidthVal, availableHeight);
    
      // Linie bazowe (poziome)
      ctx.strokeStyle = '#DE4343';
      ctx.lineWidth = 1 / scale;
      for (let i = 0; i <= nRows; i++) {
        const y = marginTop + i * optimalBaselineSpacing;
        ctx.beginPath();
        ctx.moveTo(marginLeft, y);
        ctx.lineTo(marginLeft + availableWidthVal, y);
        ctx.stroke();
      }
    
      // Guttery (wypełnienie)
      ctx.fillStyle = 'rgba(222,67,67,0.2)';
      for (let i = 1; i < nColumns; i++) {
        const gutterLeft = marginLeft + i * columnWidth + (i - 1) * gutterSpacing;
        ctx.fillRect(gutterLeft, marginTop, gutterSpacing, availableHeight);
      }
    
      // Linie pionowe (kolumny)
      ctx.strokeStyle = '#DE4343';
      ctx.lineWidth = 1 / scale;
      for (let i = 0; i <= nColumns; i++) {
        let x;
        if (i === 0) {
          x = marginLeft;
        } else if (i === nColumns) {
          x = marginLeft + availableWidthVal;
        } else {
          x = marginLeft + i * columnWidth + (i - 1) * gutterSpacing;
        }
        ctx.beginPath();
        ctx.moveTo(x, marginTop);
        ctx.lineTo(x, marginTop + availableHeight);
        ctx.stroke();
      }
    
      ctx.restore();
      saveState();
    }
    
    function downloadSVG() {
      const unit = document.getElementById('unit').value;
      const conversionFactor = (unit === "mm") ? 0.3528 : 1.3333;
    
      const pageWidth = parseFloat(document.getElementById('pageWidth').value);
      const pageHeight = parseFloat(document.getElementById('pageHeight').value);
      const marginTop = parseFloat(document.getElementById('marginTop').value);
      const marginBottom = parseFloat(document.getElementById('marginBottom').value);
      const marginLeft = parseFloat(document.getElementById('marginLeft').value);
      const marginRight = parseFloat(document.getElementById('marginRight').value);
      const fixedFontSizePt = parseFloat(document.getElementById('fontSize').value);
      const lineHeightMult = parseFloat(document.getElementById('lineHeight').value);
      const columnsInput = document.getElementById('columns').value;
      const gutterSpacing = parseFloat(document.getElementById('gutter').value);
    
      const fontSizeConverted = fixedFontSizePt * conversionFactor;
      const availableWidth = pageWidth - (marginLeft + marginRight);
      const availableHeight = pageHeight - (marginTop + marginBottom);
    
      let nRows = Math.floor( availableHeight / (fontSizeConverted * lineHeightMult) );
      if (nRows < 1) nRows = 1;
      const optimalBaselineSpacing = availableHeight / nRows;
    
      let nColumns;
      if (columnsInput !== "") {
        nColumns = Math.max(parseInt(columnsInput), 1);
      } else {
        if (fixedFontSizePt <= 8) {
          nColumns = 4;
        } else {
          nColumns = Math.floor( availableWidth / (fontSizeConverted * 5) );
          nColumns = Math.max(nColumns, 1);
        }
      }
    
      const totalGutter = (nColumns - 1) * gutterSpacing;
      const columnWidth = (availableWidth - totalGutter) / nColumns;
    
      let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${pageWidth}${unit}" height="${pageHeight}${unit}">`;
    
      // Obrys całej strony
      svgContent += `<rect x="0" y="0" width="${pageWidth}" height="${pageHeight}" fill="none" stroke="#000" stroke-width="1"/>`;
    
      // Ramka marginesów
      svgContent += `<rect x="${marginLeft}" y="${marginTop}" width="${availableWidth}" height="${availableHeight}" fill="none" stroke="#aaa" stroke-width="1"/>`;
    
      // Linie bazowe (poziome)
      for (let i = 0; i <= nRows; i++) {
        const y = marginTop + i * optimalBaselineSpacing;
        svgContent += `<line x1="${marginLeft}" y1="${y}" x2="${marginLeft + availableWidth}" y2="${y}" stroke="#DE4343" stroke-width="1"/>`;
      }
    
      // Guttery – wypełnienie
      for (let i = 1; i < nColumns; i++) {
        const gutterLeft = marginLeft + i * columnWidth + (i - 1) * gutterSpacing;
        svgContent += `<rect x="${gutterLeft}" y="${marginTop}" width="${gutterSpacing}" height="${availableHeight}" fill="#DE4343" fill-opacity="0.2"/>`;
      }
    
      // Linie pionowe (kolumny)
      for (let i = 0; i <= nColumns; i++) {
        let x;
        if (i === 0) {
          x = marginLeft;
        } else if (i === nColumns) {
          x = marginLeft + availableWidth;
        } else {
          x = marginLeft + i * columnWidth + (i - 1) * gutterSpacing;
        }
        svgContent += `<line x1="${x}" y1="${marginTop}" x2="${x}" y2="${marginTop + availableHeight}" stroke="#DE4343" stroke-width="1"/>`;
      }
    
      svgContent += `</svg>`;
    
      const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
    
      const a = document.createElement('a');
      a.href = url;
      a.download = 'siatka.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    
    document.getElementById('recalc').addEventListener('click', () => {
      recalcAndDraw();
      saveState();
    });
    document.querySelectorAll('.controls input, .controls select')
      .forEach(el => el.addEventListener('change', () => {
        recalcAndDraw();
        saveState();
      }));
    window.addEventListener('load', recalcAndDraw);
    window.addEventListener('resize', recalcAndDraw);
    
    // Przycisk Reset – przywraca ustawienia domyślne (oprócz trybu)
    document.getElementById('reset').addEventListener('click', () => {
      document.getElementById('unit').value = 'mm';
      document.getElementById('pageWidth').value = '210';
      document.getElementById('pageHeight').value = '297';
      document.getElementById('marginTop').value = '5';
      document.getElementById('marginBottom').value = '5';
      document.getElementById('marginLeft').value = '5';
      document.getElementById('marginRight').value = '5';
      document.getElementById('fontSize').value = '8';
      document.getElementById('lineHeight').value = '1.2';
      document.getElementById('columns').value = '';
      document.getElementById('gutter').value = '5';
      recalcAndDraw();
      saveState();
    });
  </script>
</body>
</html>
