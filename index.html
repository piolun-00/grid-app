  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --radius-card: 2px;
      --radius-input: 2px;
      --radius-button: 2px;
      --radius-badge: 2px;
      --gap-xs: 4px;
      --gap-sm: 8px;
      --gap-md: 16px;
      --gap-lg: 20px;
      --layout-xs: 8px;
      --layout-sm: 16px;
      --layout-md: 20px;
      --layout-lg: 32px;
      --pad-h-xs: 8px;
      --pad-h-sm: 12px;
      --pad-h-md: 16px;
      --pad-h-lg: 20px;
      --pad-v-xs: 4px;
      --pad-v-xl: 12px;
      --size-xs: 24px;
      --size-sm: 32px;
      --size-md: 40px;
      --size-lg: 48px;
      --font-h4: 28px;
      --font-body: 14px;
      --font-small: 12px;
      --font-caption: 9px;
      /* Kolory — paleta edytora brandmanuala (editor.css) */
      --bg-app: #F4F4F2;
      --bg-panel: #FFFFFF;
      --bg-soft: #F0F0EC;
      --bg-soft-hover: #E8E8E4;
      --border-dark: #E2E2DD;
      --border-mid: #E2E2DD;
      --border-light: #E2E2DD;
      --border-lighter: #C9C9C3;
      --border-focus-light: #111111;
      --text-primary: #111111;
      --text-muted: #77776F;
      /* Stan aktywny: czarne tło, biały tekst */
      --accent: #111111;
      --accent-border: #111111;
      --accent-text: #FFFFFF;
      /* Dotknięcie przycisku ±: czerwony błysk (zachowany z e354be4) */
      --press-bg: #DE4343;
      --press-border: #C62D1F;
      --press-fg: #FFFFFF;
    }

    /* Geist — interfejs. SIL OFL 1.1, patrz Typefaces/geist/LICENSE.txt */
    @font-face {
      font-family: 'Geist';
      src: url('Typefaces/geist/geist-latin-wght-normal.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Geist';
      src: url('Typefaces/geist/geist-latin-ext-wght-normal.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    /* ===== FONT ===== */
    @font-face {
      font-family: 'Fragment Mono';
      src: url('Typefaces/fragment_mono/FragmentMono-Regular.woff2') format('woff2'),
           url('Typefaces/fragment_mono/FragmentMono-Regular.woff') format('woff'),
           url('Typefaces/fragment_mono/FragmentMono-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Fragment Mono';
      src: url('Typefaces/fragment_mono/FragmentMono-Italic.woff2') format('woff2'),
           url('Typefaces/fragment_mono/FragmentMono-Italic.woff') format('woff'),
           url('Typefaces/fragment_mono/FragmentMono-Italic.ttf') format('truetype');
      font-weight: normal;
      font-style: italic;
    }

    /* ===== BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      height: 100svh;
    }
    body {
      font-family: 'Geist', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      background: var(--bg-app);
      color: var(--text-primary);
      font-size: var(--font-body);
    }

    /* ===== PASEK NOWEJ WERSJI ===== */
    .banner {
      display: flex;
      align-items: center;
      gap: var(--gap-md);
      min-height: 44px;
      padding: var(--pad-v-xl) var(--layout-md);
      background: var(--accent);
      color: var(--accent-text);
      font-size: var(--font-small);
    }
    .banner[hidden] { display: none; }
    .banner-btn {
      margin-left: auto;
      background: var(--accent-text);
      border-color: var(--accent-text);
      color: var(--accent);
      flex-shrink: 0;
    }
    body.has-banner .app { height: calc(100svh - var(--banner-h, 44px)); }
    /* Poniżej 1024 px .app ma height:auto i min-height:100svh — pasek odejmujemy od minimum,
       inaczej doklejałby się do pełnej wysokości i strona dostawałaby zbędne przewijanie. */
    @media (max-width: 1024px) {
      body.has-banner .app { height: auto; min-height: calc(100svh - var(--banner-h, 44px)); }
    }

    /* ===== LAYOUT ===== */
    .app {
      display: flex;
      height: 100svh;
      position: relative;
    }

    /* ===== PANEL PARAMETRY ===== */
    .panel-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .panel-scroll::-webkit-scrollbar {
      display: none;
    }
    .panel-scroll--params {
      flex: 0 0 332px;
      margin-left: 32px;
    }
    .panel-scroll--results {
      flex: 0 0 332px;
      margin-left: 16px;
    }
    .panel-params {
      margin: 32px 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: var(--pad-v-xl) var(--pad-h-md) var(--pad-h-lg);
      display: flex;
      flex-direction: column;
      gap: var(--gap-md);
    }
    .panel-title {
      font-size: var(--font-h4);
      font-weight: normal;
      line-height: 1;
    }

    /* ===== PANEL USTAWIENIE ===== */
    .panel-results {
      margin: 32px 0;
      background: var(--bg-soft);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: var(--pad-v-xl) var(--pad-h-md) var(--pad-h-lg);
      display: flex;
      flex-direction: column;
      gap: var(--gap-md);
    }

    /* ===== CANVAS AREA ===== */
    .panel-preview {
      flex: 1;
      margin: 32px;
      padding-top: var(--pad-v-xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--layout-sm);
      flex-shrink: 0;
    }
    .preview-title {
      font-size: var(--font-h4);
      font-weight: normal;
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 18px;
      margin-bottom: 42px;
    }
    canvas {
      background: #fff;
      box-shadow: 0 0 0 1px var(--border-lighter), 0 8px 24px rgba(0, 0, 0, .06);
      display: block;
    }

    /* ===== UNIT CONTROL (pill buttons) ===== */
    .unit-control {
      display: flex;
      align-items: center;
      gap: var(--layout-xs);
    }
    .unit-control-label {
      font-size: var(--font-small);
      white-space: nowrap;
    }
    .pill-group {
      display: flex;
      gap: var(--gap-xs);
    }
    .pill {
      width: var(--size-lg);
      height: var(--size-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-badge);
      font-size: var(--font-small);
      line-height: 1.2;
      cursor: pointer;
      border: 0.6px solid var(--border-mid);
      background: var(--bg-soft);
      color: var(--text-primary);
      font-family: inherit;
      transition: background 0.3s ease-out, border-color 0.3s ease-out, color 0.3s ease-out;
      user-select: none;
    }
    .pill.is-active {
      background: var(--accent);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    /* ===== LIGHT VARIANT (panel Ustawienie) ===== */
    .panel-results .pill {
      background: var(--bg-soft);
      border-color: var(--border-lighter);
    }
    .panel-results .pill.is-active {
      background: var(--accent);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .panel-results .btn {
      background: var(--bg-soft);
      border-color: var(--border-lighter);
    }
    /* .panel-results .btn ma wyższą swoistość niż .btn--full — akcja główna musi ją przebić */
    .panel-results .btn--full {
      background: var(--accent);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .panel-results .btn:active {
      background: var(--press-bg);
      border-color: var(--press-border);
      color: var(--press-fg);
    }

    .panel-results .btn--full:active {
      background: var(--press-bg);
      border-color: var(--press-border);
      color: var(--press-fg);
    }

    /* ===== FORM FIELD ===== */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--gap-xs);
      width: 100%;
    }
    .form-label {
      font-size: var(--font-small);
    }
    .form-field {
      display: flex;
      align-items: center;
      gap: var(--gap-lg);
      height: var(--size-sm);
      background: var(--bg-soft);
      border: 0.6px solid var(--border-mid);
      border-radius: var(--radius-input);
      padding: 0 var(--pad-h-sm);
    }
    .form-field:focus-within {
      background: var(--bg-soft);
      border-color: var(--border-lighter);
    }
    .form-input {
      font-family: 'Fragment Mono', monospace;
      font-variant-numeric: tabular-nums;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: var(--font-body);
      font-family: inherit;
      min-width: 0;
    }

    /* ===== CONTROL BUTTONS (±) ===== */
    .form-controls {
      display: flex;
      gap: var(--gap-xs);
      align-items: center;
    }
    .ctrl-btn {
      width: 16px;
      height: 16px;
      border-radius: var(--radius-badge);
      background: var(--bg-soft);
      border: 0.4px solid var(--border-mid);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease-out, border-color 0.15s ease-out, color 0.15s ease-out;
      flex-shrink: 0;
    }
    .ctrl-btn:active,
    .ctrl-btn.is-pressed {
      background: var(--press-bg);
      border-color: var(--press-border);
      color: var(--press-fg);
    }
    .ctrl-btn.is-inactive {
      opacity: 0.35;
      pointer-events: none;
    }
    .ctrl-btn svg {
      width: 10px;
      height: 10px;
    }

    /* ===== BUTTONS ===== */
    .btn-row {
      display: flex;
      gap: var(--gap-sm);
      width: 100%;
    }
    .btn {
      height: var(--size-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap-xs);
      padding: 0 var(--pad-h-sm);
      border-radius: var(--radius-button);
      font-size: var(--font-body);
      font-family: inherit;
      cursor: pointer;
      border: 0.6px solid var(--border-mid);
      background: var(--bg-soft);
      color: var(--text-primary);
      transition: background 0.15s ease-out, border-color 0.15s ease-out, color 0.15s ease-out;
      white-space: nowrap;
    }
    .btn:active {
      background: var(--press-bg);
      border-color: var(--press-border);
      color: var(--press-fg);
    }
    .btn--small { width: 146px; }
    /* Akcja główna panelu — czarna, jak „Eksport ZIP” w edytorze brandmanuala */
    .btn--full {
      width: 100%;
      background: var(--accent);
      border-color: var(--accent-border);
      color: var(--accent-text);
      gap: var(--gap-sm);
    }
    .btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ===== RESULTS TABLE ===== */
    .result-table {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .result-row {
      display: grid;
      grid-template-columns: 3fr 1fr;
      align-items: center;
      height: var(--size-sm);
      padding: 0 2px;
      font-size: var(--font-small);
      border-bottom: 0.6px solid var(--border-light);
      position: relative;
    }
    .result-row.is-copyable {
      cursor: pointer;
      transition: background 0.3s ease-out;
    }
    .result-value {
      font-family: 'Fragment Mono', monospace;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    /* ===== COPY TOOLTIP ===== */
    .copy-tooltip {
      position: absolute;
      right: 0;
      bottom: 0;
      transform: translateY(100%);
      width: 72px;
      height: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border: 0.6px solid var(--border-dark);
      border-radius: var(--radius-button);
      font-size: var(--font-caption);
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
      box-shadow: 0 0 1px rgba(46,46,46,0.29),
                  0 2px 2px rgba(46,46,46,0.25),
                  0 3px 2px rgba(46,46,46,0.15),
                  0 6px 2px rgba(46,46,46,0.04),
                  0 9px 3px rgba(46,46,46,0.01);
      z-index: 10;
    }
    .result-row.is-just-copied .copy-tooltip {
      opacity: 1;
    }

    /* ===== FOOTER ===== */
    .app-footer {
      font-size: var(--font-caption);
      color: var(--text-muted);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .footer-logo {
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      flex-shrink: 0;
      transition: color 0.3s ease-out;
    }
    .footer-logo svg {
      width: 80px;
      height: auto;
    }

    /* ===== NEW COMPONENTS ===== */
    .app-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0;
      flex-shrink: 0;
      animation: fadeIn 0.4s ease-out both;
    }
    .header-logo {
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      flex-shrink: 0;
      transition: color 0.3s ease-out;
    }
    .header-logo svg {
      width: 80px;
      height: auto;
    }
    .form-fields-grid {
      display: flex;
      flex-direction: column;
      gap: var(--layout-sm);
      width: 100%;
    }
    .panels-wrapper {
      display: contents;
    }
    .mobile-panel-toggle {
      display: none;
      gap: var(--gap-sm);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .pill-wide {
      flex: 1;
      height: var(--size-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-badge);
      font-size: var(--font-small);
      line-height: 1.2;
      cursor: pointer;
      border: 0.6px solid var(--border-mid);
      background: var(--bg-soft);
      color: var(--text-primary);
      font-family: inherit;
      transition: background 0.3s ease-out, border-color 0.3s ease-out, color 0.3s ease-out;
      user-select: none;
    }
    .pill-wide.is-active {
      background: var(--accent);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .app-footer-responsive {
      display: none;
      font-size: var(--font-caption);
      color: var(--text-muted);
      text-align: center;
      padding: 20px 16px 31px;
      flex-shrink: 0;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app.is-loaded .panel-params,
    .app.is-loaded .panel-results,
    .app.is-loaded .panel-preview {
      animation: fadeIn 0.8s ease-out both;
    }
    .app.is-loaded .panel-params { animation-delay: 0.15s; }
    .app.is-loaded .panel-preview { animation-delay: 0.35s; }
    .app.is-loaded .panel-results { animation-delay: 0.55s; }

    /* ===== HOVER STATES (pointer devices only) ===== */
    @media (hover: hover) and (pointer: fine) {
      .pill:not(.is-active):hover {
        background: var(--bg-soft);
        border-color: var(--border-lighter);
      }
      .panel-results .pill:not(.is-active):hover {
        background: var(--bg-soft-hover);
        border-color: var(--border-focus-light);
      }
      .panel-results .btn:hover,
      .panel-results .btn--full:hover {
        background: var(--accent);
        border-color: var(--accent-border);
        color: var(--accent-text);
      }
      .ctrl-btn:hover {
        background: var(--accent);
        border-color: var(--accent-border);
        color: var(--accent-text);
      }
      .btn:hover,
      .btn--full:hover {
        background: var(--accent);
        border-color: var(--accent-border);
        color: var(--accent-text);
      }
      .result-row.is-copyable:hover {
        background: var(--bg-soft);
      }
      .result-row.is-copyable .result-value:hover ~ .copy-tooltip {
        opacity: 1;
      }
      .result-row.is-copyable.is-copied .result-value:hover ~ .copy-tooltip {
        opacity: 0;
      }
      .footer-logo:hover,
      .header-logo:hover {
        color: var(--text-primary);
      }
      .pill-wide:hover {
        background: var(--bg-soft);
        border-color: var(--border-lighter);
      }
    }

    /* ===== RESPONSIVE: SHARED (≤1024px) ===== */
    @media (max-width: 1024px) {
      html, body { overflow: visible; height: auto; }
      .app {
        flex-direction: column;
        height: auto;
        min-height: 100svh;
      }
      .app-header {
        display: flex;
        order: 1;
      }
      .panel-preview {
        order: 2;
        flex: none;
        margin: 20px 20px 0;
        padding-top: 0;
      }
      .preview-header { display: none; }
      .canvas-wrap {
        margin: 0;
        height: 480px;
        flex: none;
        border: 0.6px solid var(--border-dark);
        border-radius: var(--radius-card);
      }
      .panel-preview .app-footer { display: none; }
      .panels-wrapper {
        display: contents;
      }
      .panel-scroll {
        overflow: visible;
        flex: none;
        width: 100%;
        margin: 0;
        padding: 0 20px;
        order: 4;
      }
      .panel-scroll--params { order: 3; }
      .panel-scroll--results { order: 4; }
      .panel-params, .panel-results {
        margin: 8px 0;
        width: 100%;
      }
      .mobile-panel-toggle {
        order: 3;
      }
      .app-footer-responsive {
        display: block;
        order: 6;
      }
      .btn--small { width: auto; flex: 1; }
    }

    /* ===== RESPONSIVE: TABLET (768–1024px) ===== */
    @media (max-width: 1024px) and (min-width: 768px) {
      .app-header { padding: 24px 20px 0; }
      .form-fields-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form-fields-grid .form-group:last-child {
        grid-column: 1 / -1;
      }
      .result-table {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 16px;
      }
    }

    /* ===== RESPONSIVE: MOBILE (≤767px) ===== */
    @media (max-width: 767px) {
      .app-header { padding: 24px 16px 0; }
      .panel-preview {
        margin: 20px 16px 0;
      }
      .mobile-panel-toggle {
        display: flex;
        order: 3;
        margin-top: 20px;
      }
      .panels-wrapper {
        display: flex;
        order: 4;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        gap: 16px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        margin-top: 8px;
        scroll-padding-left: 16px;
      }
      .panels-wrapper::-webkit-scrollbar { display: none; }
      .panel-scroll {
        padding: 0;
        flex: 0 0 calc(100vw - 32px);
        scroll-snap-align: start;
        overflow: visible;
        order: unset;
      }
      .panel-scroll:first-child {
        margin-left: 16px;
      }
      .panel-scroll:last-child {
        margin-right: 16px;
      }
      .panel-params, .panel-results {
        margin: 0;
      }
    }
  </style>

    }

    function applyLanguage() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = t(key);
      });
      // Update output unit pill labels
      const ptPill = document.querySelector('#outputUnitToggle [data-value="pt"]');
      const unitPill = document.querySelector('#outputUnitToggle [data-value="unit"]');
      if (ptPill) ptPill.textContent = t('unit_pt');
      if (unitPill) unitPill.textContent = currentUnit;
      // Footer
      const footerText = t('footer').replace('{year}', new Date().getFullYear());
      document.getElementById('appFooter').textContent = footerText;
      const respFooter = document.getElementById('appFooterResponsive');
      if (respFooter) respFooter.textContent = footerText;
      updateMarginLabels();
      recalcAndDraw();

    function updateMarginLabels() {
      const leftLabel = document.querySelector('[data-i18n="margin_left"]');
      const rightLabel = document.querySelector('[data-i18n="margin_right"]');
      if (leftLabel) leftLabel.textContent = facingPages ? t('margin_inner') : t('margin_left');
      if (rightLabel) rightLabel.textContent = facingPages ? t('margin_outer') : t('margin_right');

    /* ========================================
       PILL TOGGLE LOGIC
    ======================================== */
    function initPillGroup(containerId, onChange) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.addEventListener('click', e => {
        const pill = e.target.closest('.pill');
        if (!pill) return;
        container.querySelectorAll('.pill').forEach(p => p.classList.remove('is-active'));
        pill.classList.add('is-active');
        onChange(pill.dataset.value);
      });
    }

    initPillGroup('unitToggle', val => {
      currentUnit = val;
      const unitPill = document.querySelector('#outputUnitToggle [data-value="unit"]');
      if (unitPill) unitPill.textContent = val;
      recalcAndDraw();
      saveState();
    });

    initPillGroup('outputUnitToggle', val => {
      currentOutputUnit = val;
      recalcAndDraw();
      saveState();
    });

    initPillGroup('facingToggle', val => {
      facingPages = (val === 'spread');
      updateMarginLabels();
      recalcAndDraw();
      saveState();
    });

    function syncLangToggles(val) {
      document.querySelectorAll('#langToggle .pill, #langToggleHeader .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === val);
      });
    }

    initPillGroup('langToggle', val => {
      currentLang = val;
      syncLangToggles(val);
      applyLanguage();
      saveState();
    });

    initPillGroup('langToggleHeader', val => {
      currentLang = val;
      syncLangToggles(val);
      applyLanguage();
      saveState();
    });

    /* ========================================
       ± CONTROL BUTTONS
    ======================================== */
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const dir = parseInt(btn.dataset.dir, 10);
        const el = document.getElementById(targetId);
        if (!el) return;

        if (el.dataset.int) {
          let v = parseInt(el.value, 10) || 0;
          const min = parseInt(el.dataset.min || '1', 10);
          v += dir;
          if (v < min) v = min;
          el.value = String(v);
        } else {
          const min = parseFloat(el.dataset.min ?? '0');
          const decimals = parseInt(el.dataset.decimals ?? '2', 10);
          let v = parseFloat(normalizeNumberString(el.value));
          if (!Number.isFinite(v)) v = min;
          v = clampMin(v + dir * 0.1, min);
          el.value = v.toFixed(decimals);
        }

        recalcAndDraw();
        saveState();
      });

      // Touch feedback
      btn.addEventListener('touchstart', () => {
        btn.classList.add('is-pressed');
      }, { passive: true });
      btn.addEventListener('touchend', () => {
        setTimeout(() => btn.classList.remove('is-pressed'), 150);
      }, { passive: true });
      btn.addEventListener('touchcancel', () => {
        btn.classList.remove('is-pressed');
      }, { passive: true });
    });

    /* ========================================
       HELPERS
    ======================================== */
    let lastValidHModules = 1;

    function normalizeNumberString(s) {
      return String(s ?? '').trim().replace(/\s+/g, '').replace(',', '.');
    }

    function readDecimalInput(id, fallback = 0) {
      const el = document.getElementById(id);
      const raw = normalizeNumberString(el.value);
      const v = parseFloat(raw);
      return Number.isFinite(v) ? v : fallback;
    }

    function clampMin(v, min) { return v < min ? min : v; }

    /* ========================================
       INPUT EVENT HANDLERS
    ======================================== */
    document.querySelectorAll('.decimal-input').forEach(input => {
      input.addEventListener('blur', function() {
        const raw = normalizeNumberString(this.value);
        // Allow empty value for optional fields (e.g. gutter = auto)
        if (raw === '' && this.placeholder) {
          this.value = '';
          recalcAndDraw();
          saveState();
          return;
        }
        const min = parseFloat(this.dataset.min ?? '0');
        const decimals = parseInt(this.dataset.decimals ?? '2', 10);
        let v = parseFloat(raw);
        if (!Number.isFinite(v)) v = min;
        v = clampMin(v, min);
        this.value = v.toFixed(decimals);
        recalcAndDraw();
        saveState();
      });

      input.addEventListener('keydown', function(e) {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const min = parseFloat(this.dataset.min ?? '0');
        const decimals = parseInt(this.dataset.decimals ?? '2', 10);
        const delta = e.shiftKey ? 1.0 : 0.1;
        const dir = (e.key === 'ArrowUp') ? 1 : -1;
        let v = parseFloat(normalizeNumberString(this.value));
        if (!Number.isFinite(v)) v = min;
        v = clampMin(v + dir * delta, min);
        this.value = v.toFixed(decimals);
        recalcAndDraw();
        saveState();
      });
    });

    document.querySelectorAll('input[data-int]').forEach(input => {
      input.addEventListener('blur', function() {
        const min = parseInt(this.dataset.min || '1', 10);
        let current = parseInt(this.value, 10);
        if (!Number.isFinite(current) || current < min) {
          current = min;
        }
        this.value = String(current);
        recalcAndDraw();
        saveState();
      });

      input.addEventListener('keydown', function(e) {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const min = parseInt(this.dataset.min || '1', 10);
        const step = e.shiftKey ? 10 : 1;
        const dir = (e.key === 'ArrowUp') ? 1 : -1;
        let v = parseInt(this.value, 10);
        if (!Number.isFinite(v)) v = 0;
        v = v + dir * step;
        if (v < min) v = min;
        this.value = String(v);
        recalcAndDraw();
        saveState();
      });
    });

    /* ========================================
       STATE (localStorage)
    ======================================== */
    function saveState() {
      const state = {
        unit: currentUnit,
        outputUnit: currentOutputUnit,
        lang: currentLang,
        pageWidth: document.getElementById('pageWidth').value,
        pageHeight: document.getElementById('pageHeight').value,
        marginTop: document.getElementById('marginTop').value,
        marginBottom: document.getElementById('marginBottom').value,
        marginLeft: document.getElementById('marginLeft').value,
        marginRight: document.getElementById('marginRight').value,
        fontSize: document.getElementById('fontSize').value,
        lineHeight: document.getElementById('lineHeight').value,
        columns: document.getElementById('columns').value,
        hModules: document.getElementById('hModules').value,
        gutterWidth: document.getElementById('gutterWidth').value,
        facingPages: facingPages,
        mobilePanel: 'params'
      };
      localStorage.setItem('gridApp_state', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('gridApp_state');
      if (!saved) return;
      try {
        const s = JSON.parse(saved);
        if (s.unit) {
          currentUnit = s.unit;
          document.querySelectorAll('#unitToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === currentUnit);
          });
        }
        if (s.outputUnit) {
          currentOutputUnit = s.outputUnit;
          document.querySelectorAll('#outputUnitToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === currentOutputUnit);
          });
        }
        if (s.lang) {
          currentLang = s.lang;
          syncLangToggles(currentLang);
        }
        if (s.pageWidth) document.getElementById('pageWidth').value = s.pageWidth;
        if (s.pageHeight) document.getElementById('pageHeight').value = s.pageHeight;
        if (s.marginTop) document.getElementById('marginTop').value = s.marginTop;
        if (s.marginBottom) document.getElementById('marginBottom').value = s.marginBottom;
        if (s.marginLeft) document.getElementById('marginLeft').value = s.marginLeft;
        if (s.marginRight) document.getElementById('marginRight').value = s.marginRight;
        if (s.fontSize) document.getElementById('fontSize').value = s.fontSize;
        if (s.lineHeight) document.getElementById('lineHeight').value = s.lineHeight;
        if (s.columns) document.getElementById('columns').value = s.columns;
        if (s.hModules) {
          document.getElementById('hModules').value = s.hModules;
          const hv = parseInt(s.hModules, 10);
          lastValidHModules = Number.isFinite(hv) && hv >= 1 ? hv : 1;
        }
        if (s.gutterWidth !== undefined) document.getElementById('gutterWidth').value = s.gutterWidth;
        if (s.facingPages !== undefined) {
          facingPages = s.facingPages;
          document.querySelectorAll('#facingToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === (facingPages ? 'spread' : 'single'));
          });
        }
        // mobilePanel state handled by scroll position
      } catch(e) {}
    }

    loadState();

    /* ========================================
       MOBILE PANEL TOGGLE (slider)
    ======================================== */
    (function initMobilePanelToggle() {
      const toggle = document.getElementById('mobilePanelToggle');
      const wrapper = document.getElementById('panelsWrapper');
      if (!toggle || !wrapper) return;

      toggle.addEventListener('click', e => {
        const pill = e.target.closest('.pill-wide');
        if (!pill) return;
        toggle.querySelectorAll('.pill-wide').forEach(p => p.classList.remove('is-active'));
        pill.classList.add('is-active');
        const panel = pill.dataset.panel;
        if (panel === 'results') {
          const target = wrapper.querySelector('.panel-scroll--results');
          if (target) wrapper.scrollTo({ left: target.offsetLeft - wrapper.offsetLeft, behavior: 'smooth' });
        } else {
          wrapper.scrollTo({ left: 0, behavior: 'smooth' });
        }
      });

      // Sync pill state on scroll end
      let scrollTimer;
      wrapper.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const half = wrapper.scrollWidth / 2;
          const isResults = wrapper.scrollLeft > half * 0.4;
          toggle.querySelectorAll('.pill-wide').forEach(p => {
            const isActive = isResults ? p.dataset.panel === 'results' : p.dataset.panel === 'params';
            p.classList.toggle('is-active', isActive);
          });
        }, 100);
      }, { passive: true });
    })();

    /* ========================================
       GRID CALCULATION LOGIC
    ======================================== */
    function computeMaxHModules(availableHeight, fontSizeConverted) {
      const maxRows = Math.floor(availableHeight / (fontSizeConverted * 1.0));
      const maxM = Math.floor((maxRows + 1) / 4);
      return Math.max(maxM, 1);
    }

    function fitRowsToHorizontalModules(baseRows, modules, availableHeight, fontSizeConverted) {
      const M = Math.max(parseInt(modules, 10) || 1, 1);
      if (M <= 1) return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };

      const minTextRowsPerModule = 3;
      const minRows = (M * minTextRowsPerModule) + (M - 1);
      const maxRows = Math.floor(availableHeight / (fontSizeConverted * 1.0));

      if (maxRows < minRows) return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };

      const isValid = (rows) => {
        if (!Number.isFinite(rows) || rows < minRows || rows > maxRows) return false;
        const textRows = rows - (M - 1);
        return textRows >= M * minTextRowsPerModule && (textRows % M) === 0;
      };

      const maxOffset = Math.max(baseRows - minRows, maxRows - baseRows);
      for (let off = 0; off <= maxOffset; off++) {
        for (const candidate of [baseRows - off, baseRows + off]) {
          if (isValid(candidate)) {
            return { nRows: candidate, rowsPerModule: (candidate - (M - 1)) / M, hasModules: true };
          }
        }
      }
      return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };
    }

    function getHorizontalModuleGapRowIndices(modules, rowsPerModule) {
      const M = Math.max(parseInt(modules, 10) || 1, 1);
      if (M <= 1) return [];
      const gaps = [];
      for (let m = 0; m < M - 1; m++) {
        gaps.push((m + 1) * rowsPerModule + m);
      }
      return gaps;
    }

    /* ----------------------------------------
       Jedno miejsce, w którym liczy się siatka.
       Czysta funkcja: te same wejścia dają ten sam wynik.
       Korzystają z niej tabela wyników, podgląd i eksport SVG —
       wcześniej każde z nich liczyło po swojemu.
    ---------------------------------------- */
    function readGridInputs() {
      const unit = currentUnit;
      const hModulesEl = document.getElementById('hModules');
      const gutterEl = document.getElementById('gutterWidth');
      return {
        unit,
        conversionFactor: (unit === "mm") ? 0.3528 : 1.3333,
        pageWidth: readDecimalInput('pageWidth', 0),
        pageHeight: readDecimalInput('pageHeight', 0),
        marginTop: readDecimalInput('marginTop', 0),
        marginBottom: readDecimalInput('marginBottom', 0),
        marginLeft: readDecimalInput('marginLeft', 0),
        marginRight: readDecimalInput('marginRight', 0),
        fontSizePt: readDecimalInput('fontSize', 8),
        lineHeightMult: readDecimalInput('lineHeight', 1.2),
        columnsInput: document.getElementById('columns').value,
        hModulesInput: hModulesEl ? String(hModulesEl.value).trim() : "",
        gutterRaw: gutterEl ? normalizeNumberString(gutterEl.value) : ''
      };
    }

    function computeGrid(p) {
      const fontSizeConverted = p.fontSizePt * p.conversionFactor;
      const availableWidth = p.pageWidth - (p.marginLeft + p.marginRight);
      const availableHeight = p.pageHeight - (p.marginTop + p.marginBottom);

      // Moduły poziome: wartość z pola, ograniczona tym, co mieści się na stronie.
      const maxHModules = computeMaxHModules(availableHeight, fontSizeConverted);
      const hasModulesInput = p.hModulesInput !== "";
      let modulesCount = hasModulesInput ? Math.max(parseInt(p.hModulesInput, 10) || 1, 1) : 1;
      let modulesClamped = false;
      if (hasModulesInput && modulesCount > maxHModules) {
        modulesCount = lastValidHModules;
        modulesClamped = true;
      }

      let nRowsBase = Math.floor(availableHeight / (fontSizeConverted * p.lineHeightMult));
      if (nRowsBase < 1) nRowsBase = 1;

      const fit = fitRowsToHorizontalModules(nRowsBase, modulesCount, availableHeight, fontSizeConverted);
      const nRows = fit.nRows;
      const rowsPerModule = fit.hasModules ? fit.rowsPerModule : null;
      const baselineSpacing = availableHeight / nRows;
      const baselineSpacingPt = baselineSpacing / p.conversionFactor;
      const gapRowIndices = fit.hasModules ? getHorizontalModuleGapRowIndices(modulesCount, rowsPerModule) : [];

      // Światło międzykolumnowe: wartość własna albo interlinia.
      const gutterCustom = parseFloat(p.gutterRaw);
      const gutterAuto = !(p.gutterRaw !== '' && Number.isFinite(gutterCustom) && gutterCustom >= 0);
      const gutterSpacing = gutterAuto ? baselineSpacing : gutterCustom;

      // Kolumny: wartość z pola albo wyliczona ze stopnia pisma.
      const columnsAuto = p.columnsInput === "";
      let nColumns;
      if (!columnsAuto) {
        nColumns = Math.max(parseInt(p.columnsInput, 10), 1);
      } else if (p.fontSizePt <= 8) {
        nColumns = 4;
      } else {
        nColumns = Math.max(Math.floor(availableWidth / (fontSizeConverted * 5)), 1);
      }

      const columnWidth = (availableWidth - (nColumns - 1) * gutterSpacing) / nColumns;
      const realLhCoeff = fontSizeConverted > 0 ? baselineSpacing / fontSizeConverted : p.lineHeightMult;

      return {
        fontSizeConverted, availableWidth, availableHeight,
        maxHModules, modulesCount, modulesClamped, hasModulesInput,
        nRowsBase, nRows, rowsPerModule, hasModules: fit.hasModules,
        baselineSpacing, baselineSpacingPt, gapRowIndices,
        gutterSpacing, gutterAuto, nColumns, columnsAuto, columnWidth, realLhCoeff
      };
    }


    /* ========================================
       UPDATE ± BUTTON STATES
    ======================================== */
    function updateCtrlBtnStates() {
      document.querySelectorAll('.ctrl-btn').forEach(btn => {
        const targetId = btn.dataset.target;
        const dir = parseInt(btn.dataset.dir, 10);
        const el = document.getElementById(targetId);
        if (!el) return;

        let inactive = false;
        if (el.dataset.int) {
          const v = parseInt(el.value, 10) || 0;
          const min = parseInt(el.dataset.min || '1', 10);
          if (dir === -1 && v <= min) inactive = true;
          if (dir === 1 && targetId === 'hModules') {
            const unit = currentUnit;
            const cf = (unit === 'mm') ? 0.3528 : 1.3333;
            const fsc = readDecimalInput('fontSize', 8) * cf;
            const ah = readDecimalInput('pageHeight', 0) - readDecimalInput('marginTop', 0) - readDecimalInput('marginBottom', 0);
            const maxM = computeMaxHModules(ah, fsc);
            if (v >= maxM) inactive = true;
          }
        } else {
          const v = parseFloat(normalizeNumberString(el.value));
          const min = parseFloat(el.dataset.min ?? '0');
          if (dir === -1 && v <= min + 0.05) inactive = true;
        }

        btn.classList.toggle('is-inactive', inactive);
      });
    }

    /* ========================================
       COPY TO CLIPBOARD
    ======================================== */
    function copyValue(rowEl, value) {
      navigator.clipboard.writeText(value).then(() => {
        const tooltip = rowEl.querySelector('.copy-tooltip');
        if (!tooltip) return;
        tooltip.textContent = t('copied');
        rowEl.classList.add('is-just-copied');

        setTimeout(() => {
          rowEl.classList.remove('is-just-copied');
          rowEl.classList.add('is-copied');
          const reset = () => {
            tooltip.textContent = t('copy');
            rowEl.classList.remove('is-copied');
          };
          // On pointer devices: wait for mouse leave then re-enter
          const isTouch = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
          if (isTouch) {
            // On touch: just reset after a short delay
            setTimeout(reset, 500);
          } else {
            const onLeave = () => {
              rowEl.addEventListener('mouseenter', () => reset(), { once: true });
            };
            rowEl.addEventListener('mouseleave', onLeave, { once: true });
          }
        }, 2000);
      });
    }

    /* ========================================
       RECALC AND DRAW
    ======================================== */
    function recalcAndDraw() {
      const p = readGridInputs();
      const g = computeGrid(p);

      const unit = p.unit;
      const pageWidth = p.pageWidth;
      const pageHeight = p.pageHeight;
      const marginTop = p.marginTop;
      const marginBottom = p.marginBottom;
      const marginLeft = p.marginLeft;
      const marginRight = p.marginRight;
      const fixedFontSizePt = p.fontSizePt;
      const hModulesInput = p.hModulesInput;

      const fontSizeConverted = g.fontSizeConverted;
      const availableWidthVal = g.availableWidth;
      const modulesCount = g.modulesCount;
      const nRowsBase = g.nRowsBase;
      const nRows = g.nRows;
      const rowsPerModule = g.rowsPerModule;
      const optimalBaselineSpacing = g.baselineSpacing;
      const optimalBaselineSpacingPt = g.baselineSpacingPt;
      const gapRowIndices = g.gapRowIndices;
      const gutterSpacing = g.gutterSpacing;
      const nColumns = g.nColumns;
      const columnWidth = g.columnWidth;
      const realLhCoeff = g.realLhCoeff;

      // Wynik z powrotem do pól — jedyne miejsce, w którym liczenie dotyka formularza.
      const hModulesEl = document.getElementById('hModules');
      if (hModulesEl && g.modulesClamped) hModulesEl.value = String(modulesCount);
      lastValidHModules = g.hasModulesInput ? modulesCount : 1;
      if (g.columnsAuto) document.getElementById('columns').value = nColumns;
      const gutterEl = document.getElementById('gutterWidth');
      if (gutterEl) gutterEl.placeholder = optimalBaselineSpacing.toFixed(2);

      // ===== BUILD RESULTS TABLE =====
      const ptUnit = t('unit_pt'); // pkt or pt
      const showInPt = (currentOutputUnit === 'pt');

      function fmtVal(valuePt, valueUnit) {
        if (showInPt) return `${valuePt.toFixed(2)} ${ptUnit}`;
        return `${valueUnit.toFixed(2)} ${unit}`;
      }

      const rows = [
        { key: 'r_baseline_rows', val: String(nRows) },
        { key: 'r_font_size', val: fmtVal(fixedFontSizePt, fontSizeConverted), copyable: true, copyVal: fmtVal(fixedFontSizePt, fontSizeConverted) },
        { key: 'r_leading', val: fmtVal(optimalBaselineSpacingPt, optimalBaselineSpacing), copyable: true, copyVal: fmtVal(optimalBaselineSpacingPt, optimalBaselineSpacing) },
        { key: 'r_lh_coeff', val: realLhCoeff.toFixed(2) },
        { key: 'r_h_modules', val: String(hModulesInput !== "" ? modulesCount : 1) },
        { key: 'r_rows_per_mod', val: rowsPerModule !== null ? String(rowsPerModule) : '-' },
        { key: 'r_baseline_adj', val: nRows + (nRowsBase !== nRows ? ` (${nRowsBase})` : '') },
        { key: 'r_columns', val: String(nColumns) },
        { key: 'r_col_width', val: `${columnWidth.toFixed(2)} ${unit}` },
        { key: 'r_gutter', val: `${gutterSpacing.toFixed(2)} ${unit}` },
        { key: 'r_page_w', val: `${pageWidth.toFixed(2)} ${unit}` },
        { key: 'r_page_h', val: `${pageHeight.toFixed(2)} ${unit}` },
        { key: 'r_margin_t', val: `${marginTop.toFixed(2)} ${unit}` },
        { key: 'r_margin_b', val: `${marginBottom.toFixed(2)} ${unit}` },
        { key: facingPages ? 'r_margin_inner' : 'r_margin_l', val: `${marginLeft.toFixed(2)} ${unit}` },
        { key: facingPages ? 'r_margin_outer' : 'r_margin_r', val: `${marginRight.toFixed(2)} ${unit}` },
      ];

      const tableEl = document.getElementById('resultsTable');
      tableEl.innerHTML = rows.map(r => {
        const cls = r.copyable ? ' is-copyable' : '';
        const tooltip = r.copyable ? `<span class="copy-tooltip">${t('copy')}</span>` : '';
        return `<div class="result-row${cls}" ${r.copyable ? `data-copy-val="${r.copyVal}"` : ''}>
          <span>${t(r.key)}</span>
          <span class="result-value">${r.val}</span>
          ${tooltip}
        </div>`;
      }).join('');

      // Attach copy handlers
      tableEl.querySelectorAll('.is-copyable').forEach(row => {
        row.addEventListener('click', () => copyValue(row, row.dataset.copyVal));
      });

      // ===== DRAW CANVAS =====
      const canvas = document.getElementById('gridCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.querySelector('.canvas-wrap');
      const contentWidth = container.clientWidth;
      const contentHeight = container.clientHeight;

      if (contentWidth <= 0 || contentHeight <= 0) return;

      // Helper: draw one page's grid at offset xOff with given left/right margins
      function drawPageGrid(ctx, scale, xOff, pw, ph, mLeft, mRight, mTop, mBottom) {
        const aw = pw - (mLeft + mRight);
        const ah = ph - (mTop + mBottom);

        // Page background
        ctx.fillStyle = '#fff';
        ctx.fillRect(xOff, 0, pw, ph);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1 / scale;
        ctx.strokeRect(xOff, 0, pw, ph);

        // Margin area
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1 / scale;
        ctx.strokeRect(xOff + mLeft, mTop, aw, ah);

        // Module gap rows
        if (gapRowIndices.length > 0) {
          ctx.fillStyle = 'rgba(17,59,183,0.2)';
          for (const rowIdx of gapRowIndices) {
            const yGap = mTop + rowIdx * optimalBaselineSpacing;
            ctx.fillRect(xOff + mLeft, yGap, aw, optimalBaselineSpacing);
          }
        }

        // Baseline rows
        ctx.strokeStyle = '#DE4343';
        ctx.lineWidth = 1 / scale;
        for (let i = 0; i <= nRows; i++) {
          const y = mTop + i * optimalBaselineSpacing;
          ctx.beginPath();
          ctx.moveTo(xOff + mLeft, y);
          ctx.lineTo(xOff + mLeft + aw, y);
          ctx.stroke();
        }

        // Gutter fills
        ctx.fillStyle = 'rgba(222,67,67,0.2)';
        for (let i = 1; i < nColumns; i++) {
          const gutterLeft = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          ctx.fillRect(gutterLeft, mTop, gutterSpacing, ah);
        }

        // Column lines
        ctx.strokeStyle = '#DE4343';
        ctx.lineWidth = 1 / scale;
        for (let i = 0; i <= nColumns; i++) {
          let x;
          if (i === 0) x = xOff + mLeft;
          else if (i === nColumns) x = xOff + mLeft + aw;
          else x = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          ctx.beginPath();
          ctx.moveTo(x, mTop);
          ctx.lineTo(x, mTop + ah);
          ctx.stroke();
        }
      }

      const totalWidth = facingPages ? pageWidth * 2 : pageWidth;
      const fitScale = Math.min(contentWidth / totalWidth, contentHeight / pageHeight);
      const minScale = Math.max(120 / totalWidth, 200 / pageHeight);
      const scale = Math.max(fitScale, minScale);

      canvas.width = Math.max(1, Math.round(totalWidth * scale));
      canvas.height = Math.max(1, Math.round(pageHeight * scale));
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(scale, scale);

      if (facingPages) {
        // Left page: outer=marginRight, inner=marginLeft
        drawPageGrid(ctx, scale, 0, pageWidth, pageHeight, marginRight, marginLeft, marginTop, marginBottom);
        // Right page: inner=marginLeft, outer=marginRight
        drawPageGrid(ctx, scale, pageWidth, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
        // Spine line
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5 / scale;
        ctx.beginPath();
        ctx.moveTo(pageWidth, 0);
        ctx.lineTo(pageWidth, pageHeight);
        ctx.stroke();
      } else {
        drawPageGrid(ctx, scale, 0, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
      }

      ctx.restore();
      updateCtrlBtnStates();
      saveState();
    }

    /* ========================================
       DOWNLOAD SVG
    ======================================== */
    function downloadSVG() {
      const p = readGridInputs();
      const g = computeGrid(p);

      const unit = p.unit;
      const pageWidth = p.pageWidth;
      const pageHeight = p.pageHeight;
      const marginTop = p.marginTop;
      const marginBottom = p.marginBottom;
      const marginLeft = p.marginLeft;
      const marginRight = p.marginRight;

      const nRows = g.nRows;
      const optimalBaselineSpacing = g.baselineSpacing;
      const gapRowIndices = g.gapRowIndices;
      const gutterSpacing = g.gutterSpacing;
      const nColumns = g.nColumns;
      const columnWidth = g.columnWidth;

      // Helper: generate SVG elements for one page at xOffset
      function svgPageGrid(xOff, pw, ph, mLeft, mRight, mTop, mBottom) {
        const aw = pw - (mLeft + mRight);
        const ah = ph - (mTop + mBottom);
        let s = '';
        s += `<rect x="${xOff}" y="0" width="${pw}" height="${ph}" fill="none" stroke="#000" stroke-width="0.25"/>`;
        s += `<rect x="${xOff + mLeft}" y="${mTop}" width="${aw}" height="${ah}" fill="none" stroke="#aaa" stroke-width="0.25"/>`;

        if (gapRowIndices.length > 0) {
          for (const rowIdx of gapRowIndices) {
            const yGap = mTop + rowIdx * optimalBaselineSpacing;
            s += `<rect x="${xOff + mLeft}" y="${yGap}" width="${aw}" height="${optimalBaselineSpacing}" fill="#113BB7" fill-opacity="0.2"/>`;
          }
        }

        for (let i = 0; i <= nRows; i++) {
          const y = mTop + i * optimalBaselineSpacing;
          s += `<line x1="${xOff + mLeft}" y1="${y}" x2="${xOff + mLeft + aw}" y2="${y}" stroke="#DE4343" stroke-width="0.25"/>`;
        }

        for (let i = 1; i < nColumns; i++) {
          const gutterLeft = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          s += `<rect x="${gutterLeft}" y="${mTop}" width="${gutterSpacing}" height="${ah}" fill="#DE4343" fill-opacity="0.2"/>`;
        }

        for (let i = 0; i <= nColumns; i++) {
          let x;
          if (i === 0) x = xOff + mLeft;
          else if (i === nColumns) x = xOff + mLeft + aw;
          else x = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          s += `<line x1="${x}" y1="${mTop}" x2="${x}" y2="${mTop + ah}" stroke="#DE4343" stroke-width="0.25"/>`;
        }
        return s;
      }

      const totalW = facingPages ? pageWidth * 2 : pageWidth;
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}${unit}" height="${pageHeight}${unit}" viewBox="0 0 ${totalW} ${pageHeight}">`;

      if (facingPages) {
        svg += svgPageGrid(0, pageWidth, pageHeight, marginRight, marginLeft, marginTop, marginBottom);
        svg += svgPageGrid(pageWidth, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
        svg += `<line x1="${pageWidth}" y1="0" x2="${pageWidth}" y2="${pageHeight}" stroke="#000" stroke-width="0.5"/>`;
      } else {
        svg += svgPageGrid(0, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
      }

      svg += `</svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = facingPages ? 'siatka-rozkladowka.svg' : 'siatka.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ========================================
       NOWA WERSJA NA SERWERZE
       Wzorzec z edytora brandmanuala: version.json obok strony,
       porównanie z wersją wbudowaną w tę kopię, pasek z prośbą
       o odświeżenie. Bez odpytywania, gdy pasek już wisi.
    ======================================== */
    const APP_VERSION = '2026.11.05.1';

    (function watchVersion() {
      const banner = document.getElementById('updateBanner');
      if (!banner) return;
      document.getElementById('updateReload').addEventListener('click', () => location.reload());

      // Pasek łamie się na wąskim ekranie, więc wysokość mierzymy zamiast zakładać.
      const syncHeight = () => {
        document.documentElement.style.setProperty('--banner-h', banner.offsetHeight + 'px');
        recalcAndDraw(); // podgląd dostaje mniej wysokości
      };

      const check = async () => {
        if (!banner.hidden) return;
        try {
          const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return;
          const data = await r.json();
          if (data.version && data.version !== APP_VERSION) {
            banner.hidden = false;
            document.body.classList.add('has-banner');
            syncHeight();
            addEventListener('resize', syncHeight);
          }
        } catch {}
      };

      check();
      setInterval(check, 5 * 60 * 1000);
      addEventListener('focus', check);
    })();

    /* ========================================
       EVENT BINDINGS
    ======================================== */
    document.getElementById('recalc').addEventListener('click', () => { recalcAndDraw(); saveState(); });
    document.getElementById('downloadSVG').addEventListener('click', downloadSVG);

    document.getElementById('reset').addEventListener('click', () => {
      currentUnit = 'mm';
      document.querySelectorAll('#unitToggle .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === 'mm');
      });
      document.getElementById('pageWidth').value = '210.00';
      document.getElementById('pageHeight').value = '297.00';
      document.getElementById('marginTop').value = '5.00';
      document.getElementById('marginBottom').value = '5.00';
      document.getElementById('marginLeft').value = '5.00';
      document.getElementById('marginRight').value = '5.00';
      document.getElementById('fontSize').value = '8.00';
      document.getElementById('lineHeight').value = '1.20';
      document.getElementById('columns').value = '1';
      document.getElementById('hModules').value = '1';
      document.getElementById('gutterWidth').value = '';
      facingPages = false;
      document.querySelectorAll('#facingToggle .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === 'single');
      });
      updateMarginLabels();
      lastValidHModules = 1;
      recalcAndDraw();
      saveState();
    });

    /* ========================================
       INIT
    ======================================== */
    window.addEventListener('load', () => {
      applyLanguage();
      recalcAndDraw();
      const app = document.querySelector('.app');
      app.classList.add('is-loaded');
      // Remove class after animations complete to prevent replays
      setTimeout(() => app.classList.remove('is-loaded'), 1500);
    });
    window.addEventListener('resize', recalcAndDraw);
  </script>
