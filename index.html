    let currentLang = 'pl';
    let currentUnit = 'mm'; // input unit
    let currentOutputUnit = 'pt'; // output unit: 'pt' or 'unit' (same as input)
    let facingPages = false; // single page or spread

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || key;
    }

    function applyLanguage() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = t(key);
      });
      // Update output unit pill labels
      const ptPill = document.querySelector('#outputUnitToggle [data-value="pt"]');
      const unitPill = document.querySelector('#outputUnitToggle [data-value="unit"]');
      if (ptPill) ptPill.textContent = t('unit_pt');
      if (unitPill) unitPill.textContent = currentUnit;
      // Footer
      const footerText = t('footer').replace('{year}', new Date().getFullYear());
      document.getElementById('appFooter').textContent = footerText;
      const respFooter = document.getElementById('appFooterResponsive');
      if (respFooter) respFooter.textContent = footerText;
      updateMarginLabels();
      recalcAndDraw();
    }

    function updateMarginLabels() {
      const leftLabel = document.querySelector('[data-i18n="margin_left"]');
      const rightLabel = document.querySelector('[data-i18n="margin_right"]');
      if (leftLabel) leftLabel.textContent = facingPages ? t('margin_inner') : t('margin_left');
      if (rightLabel) rightLabel.textContent = facingPages ? t('margin_outer') : t('margin_right');
    }

    /* ========================================
       PILL TOGGLE LOGIC
    ======================================== */
    function initPillGroup(containerId, onChange) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.addEventListener('click', e => {
        const pill = e.target.closest('.pill');
        if (!pill) return;
        container.querySelectorAll('.pill').forEach(p => p.classList.remove('is-active'));
        pill.classList.add('is-active');
        onChange(pill.dataset.value);
      });
    }

    /* Długości trzymane są w jednostce aktywnej w chwili wpisania. Bez przeliczenia
       strona 148 mm po przejściu na piksele zostawała „148" i nagle znaczyła co innego.
       Stopień pisma jest w punktach, a interlinia i liczby modułów są bezwymiarowe —
       tych nie ruszamy. */
    const LENGTH_INPUTS = ['pageWidth', 'pageHeight', 'marginTop', 'marginBottom',
                           'marginLeft', 'marginRight', 'gutterWidth'];

    function convertLengthInputs(from, to) {
      if (from === to) return;
      const factor = (from === 'mm') ? MM_TO_PX : 1 / MM_TO_PX;
      for (const id of LENGTH_INPUTS) {
        const el = document.getElementById(id);
        if (!el) continue;
        const raw = normalizeNumberString(el.value);
        if (raw === '') continue; // puste światło to „auto" — zostaje puste
        const v = parseFloat(raw);
        if (!Number.isFinite(v)) continue;
        el.value = (v * factor).toFixed(2);
      }
    }

    initPillGroup('unitToggle', val => {
      convertLengthInputs(currentUnit, val);
      currentUnit = val;
      const unitPill = document.querySelector('#outputUnitToggle [data-value="unit"]');
      if (unitPill) unitPill.textContent = val;
      recalcAndDraw();
      saveState();
    });

    initPillGroup('outputUnitToggle', val => {
      currentOutputUnit = val;
      recalcAndDraw();
      saveState();
    });

    initPillGroup('facingToggle', val => {
      facingPages = (val === 'spread');
      updateMarginLabels();
      recalcAndDraw();
      saveState();
    });

    function syncLangToggles(val) {
      document.querySelectorAll('#langToggle .pill, #langToggleHeader .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === val);
      });
    }

    initPillGroup('langToggle', val => {
      currentLang = val;
      syncLangToggles(val);
      applyLanguage();
      saveState();
    });

    initPillGroup('langToggleHeader', val => {
      currentLang = val;
      syncLangToggles(val);
      applyLanguage();
      saveState();
    });

    /* ========================================
       ± CONTROL BUTTONS
    ======================================== */
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const dir = parseInt(btn.dataset.dir, 10);
        const el = document.getElementById(targetId);
        if (!el) return;

        if (el.dataset.int) {
          let v = parseInt(el.value, 10) || 0;
          const min = parseInt(el.dataset.min || '1', 10);
          v += dir;
          if (v < min) v = min;
          el.value = String(v);
        } else {
          const min = parseFloat(el.dataset.min ?? '0');
          const decimals = parseInt(el.dataset.decimals ?? '2', 10);
          let v = parseFloat(normalizeNumberString(el.value));
          if (!Number.isFinite(v)) v = min;
          v = clampMin(v + dir * 0.1, min);
          el.value = v.toFixed(decimals);
        }

        recalcAndDraw();
        saveState();
      });

      // Touch feedback
      btn.addEventListener('touchstart', () => {
        btn.classList.add('is-pressed');
      }, { passive: true });
      btn.addEventListener('touchend', () => {
        setTimeout(() => btn.classList.remove('is-pressed'), 150);
      }, { passive: true });
      btn.addEventListener('touchcancel', () => {
        btn.classList.remove('is-pressed');
      }, { passive: true });
    });

    /* ========================================
       HELPERS
    ======================================== */
    let lastValidHModules = 1;

    function normalizeNumberString(s) {
      return String(s ?? '').trim().replace(/\s+/g, '').replace(',', '.');
    }

    function readDecimalInput(id, fallback = 0) {
      const el = document.getElementById(id);
      const raw = normalizeNumberString(el.value);
      const v = parseFloat(raw);
      return Number.isFinite(v) ? v : fallback;
    }

    function clampMin(v, min) { return v < min ? min : v; }

    /* ========================================
       INPUT EVENT HANDLERS
    ======================================== */
    document.querySelectorAll('.decimal-input').forEach(input => {
      input.addEventListener('blur', function() {
        const raw = normalizeNumberString(this.value);
        // Allow empty value for optional fields (e.g. gutter = auto)
        if (raw === '' && this.placeholder) {
          this.value = '';
          recalcAndDraw();
          saveState();
          return;
        }
        const min = parseFloat(this.dataset.min ?? '0');
        const decimals = parseInt(this.dataset.decimals ?? '2', 10);
        let v = parseFloat(raw);
        if (!Number.isFinite(v)) v = min;
        v = clampMin(v, min);
        this.value = v.toFixed(decimals);
        recalcAndDraw();
        saveState();
      });

      input.addEventListener('keydown', function(e) {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const min = parseFloat(this.dataset.min ?? '0');
        const decimals = parseInt(this.dataset.decimals ?? '2', 10);
        const delta = e.shiftKey ? 1.0 : 0.1;
        const dir = (e.key === 'ArrowUp') ? 1 : -1;
        let v = parseFloat(normalizeNumberString(this.value));
        if (!Number.isFinite(v)) v = min;
        v = clampMin(v + dir * delta, min);
        this.value = v.toFixed(decimals);
        recalcAndDraw();
        saveState();
      });
    });

    document.querySelectorAll('input[data-int]').forEach(input => {
      input.addEventListener('blur', function() {
        const min = parseInt(this.dataset.min || '1', 10);
        let current = parseInt(this.value, 10);
        if (!Number.isFinite(current) || current < min) {
          current = min;
        }
        this.value = String(current);
        recalcAndDraw();
        saveState();
      });

      input.addEventListener('keydown', function(e) {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const min = parseInt(this.dataset.min || '1', 10);
        const step = e.shiftKey ? 10 : 1;
        const dir = (e.key === 'ArrowUp') ? 1 : -1;
        let v = parseInt(this.value, 10);
        if (!Number.isFinite(v)) v = 0;
        v = v + dir * step;
        if (v < min) v = min;
        this.value = String(v);
        recalcAndDraw();
        saveState();
      });
    });

    /* ========================================
       STATE (localStorage)
    ======================================== */
    function saveState() {
      const state = {
        unit: currentUnit,
        outputUnit: currentOutputUnit,
        lang: currentLang,
        pageWidth: document.getElementById('pageWidth').value,
        pageHeight: document.getElementById('pageHeight').value,
        marginTop: document.getElementById('marginTop').value,
        marginBottom: document.getElementById('marginBottom').value,
        marginLeft: document.getElementById('marginLeft').value,
        marginRight: document.getElementById('marginRight').value,
        fontSize: document.getElementById('fontSize').value,
        lineHeight: document.getElementById('lineHeight').value,
        columns: document.getElementById('columns').value,
        hModules: document.getElementById('hModules').value,
        gutterWidth: document.getElementById('gutterWidth').value,
        facingPages: facingPages,
        firstHeightMode: document.getElementById('firstHeightMode').value,
        showGuides: document.getElementById('showGuides').checked,
        showSpecimen: document.getElementById('showSpecimen').checked,
        groupOpen: groupOpen,
        previewZoom: previewZoom,
        mobilePanel: 'params'
      };
      localStorage.setItem('gridApp_state', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('gridApp_state');
      if (!saved) return;
      try {
        const s = JSON.parse(saved);
        if (s.unit) {
          currentUnit = s.unit;
          document.querySelectorAll('#unitToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === currentUnit);
          });
        }
        if (s.outputUnit) {
          currentOutputUnit = s.outputUnit;
          document.querySelectorAll('#outputUnitToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === currentOutputUnit);
          });
        }
        if (s.lang) {
          currentLang = s.lang;
          syncLangToggles(currentLang);
        }
        if (s.pageWidth) document.getElementById('pageWidth').value = s.pageWidth;
        if (s.pageHeight) document.getElementById('pageHeight').value = s.pageHeight;
        if (s.marginTop) document.getElementById('marginTop').value = s.marginTop;
        if (s.marginBottom) document.getElementById('marginBottom').value = s.marginBottom;
        if (s.marginLeft) document.getElementById('marginLeft').value = s.marginLeft;
        if (s.marginRight) document.getElementById('marginRight').value = s.marginRight;
        if (s.fontSize) document.getElementById('fontSize').value = s.fontSize;
        if (s.lineHeight) document.getElementById('lineHeight').value = s.lineHeight;
        if (s.firstHeightMode) document.getElementById('firstHeightMode').value = s.firstHeightMode;
        if (typeof s.showGuides === 'boolean') document.getElementById('showGuides').checked = s.showGuides;
        if (typeof s.showSpecimen === 'boolean') document.getElementById('showSpecimen').checked = s.showSpecimen;
        if (s.groupOpen && typeof s.groupOpen === 'object') Object.assign(groupOpen, s.groupOpen);
        if (typeof s.previewZoom === 'number' && s.previewZoom >= 0.5 && s.previewZoom <= 4) {
          previewZoom = s.previewZoom;
          const shown = Math.round(previewZoom * 100);
          document.getElementById('zoomRange').value = String(shown);
          document.getElementById('zoomValue').textContent = shown + '%';
        }
        if (s.columns) document.getElementById('columns').value = s.columns;
        if (s.hModules) {
          document.getElementById('hModules').value = s.hModules;
          const hv = parseInt(s.hModules, 10);
          lastValidHModules = Number.isFinite(hv) && hv >= 1 ? hv : 1;
        }
        if (s.gutterWidth !== undefined) document.getElementById('gutterWidth').value = s.gutterWidth;
        if (s.facingPages !== undefined) {
          facingPages = s.facingPages;
          document.querySelectorAll('#facingToggle .pill').forEach(p => {
            p.classList.toggle('is-active', p.dataset.value === (facingPages ? 'spread' : 'single'));
          });
        }
        // mobilePanel state handled by scroll position
      } catch(e) {}
    }

    /* ========================================
       ZOOM PODGLĄDU
       1 = dopasowanie do panelu, czyli to, co było dotąd.
    ======================================== */
    let previewZoom = 1;

    function setZoom(pct) {
      previewZoom = Math.min(4, Math.max(0.5, pct / 100));
      const shown = Math.round(previewZoom * 100);
      if (shown === Number(document.getElementById('zoomRange').value) &&
          document.getElementById('zoomValue').textContent === shown + '%') return;
      document.getElementById('zoomRange').value = String(shown);
      document.getElementById('zoomValue').textContent = shown + '%';
      recalcAndDraw();
      saveState();
    }

    document.getElementById('zoomRange').addEventListener('input', e => setZoom(Number(e.target.value)));
    document.getElementById('zoomIn').addEventListener('click', () => setZoom(Math.round(previewZoom * 100) + 25));
    document.getElementById('zoomOut').addEventListener('click', () => setZoom(Math.round(previewZoom * 100) - 25));
    document.getElementById('zoomFit').addEventListener('click', () => setZoom(100));

    /* Zoom kółkiem z Cmd/Ctrl, jak w Figmie. Na gładziku macOS szczypanie
       przychodzi jako wheel z ctrlKey, więc to samo zdarzenie obsługuje
       i skrót, i gest. Mnożenie zamiast dodawania — krok jest wtedy
       jednakowy w odbiorze przy każdym powiększeniu. */
    document.querySelector('.canvas-wrap').addEventListener('wheel', e => {
      if (!e.metaKey && !e.ctrlKey) return;
      e.preventDefault();
      setZoom(previewZoom * Math.exp(-e.deltaY * 0.0015) * 100);
    }, { passive: false });

    /* ========================================
       PRESETY FORMATU
       Wartości w mm; przy jednostce px przeliczane tym samym
       współczynnikiem co reszta aplikacji (pt -> jednostka).
    ======================================== */
    const MM_TO_PX = 1.3333 / 0.3528;

    function formatToUnit(mm) {
      return currentUnit === 'mm' ? mm : mm * MM_TO_PX;
    }

    function updateFormatPills() {
      const w = readDecimalInput('pageWidth', 0);
      const h = readDecimalInput('pageHeight', 0);
      document.querySelectorAll('#formatToggle .pill').forEach(p => {
        const pw = formatToUnit(parseFloat(p.dataset.w));
        const ph = formatToUnit(parseFloat(p.dataset.h));
        p.classList.toggle('is-active', Math.abs(pw - w) < 0.01 && Math.abs(ph - h) < 0.01);
      });
    }

    document.querySelectorAll('#formatToggle .pill').forEach(p => {
      p.addEventListener('click', () => {
        document.getElementById('pageWidth').value = formatToUnit(parseFloat(p.dataset.w)).toFixed(2);
        document.getElementById('pageHeight').value = formatToUnit(parseFloat(p.dataset.h)).toFixed(2);
        updateFormatPills();
        recalcAndDraw();
        saveState();
      });
    });

    /* ========================================
       LINK Z PARAMETRAMI SIATKI
       Cały stan siatki to kilkanaście liczb, więc mieści się w adresie.
       Link wygrywa z zapisanym stanem — ktoś go przysłał właśnie po to.
    ======================================== */
    const SHARE_FIELDS = {
      w: 'pageWidth', h: 'pageHeight', mt: 'marginTop', mb: 'marginBottom',
      ml: 'marginLeft', mr: 'marginRight', fs: 'fontSize', lh: 'lineHeight',
      mod: 'hModules', col: 'columns', g: 'gutterWidth'
    };

    function buildShareUrl() {
      const p = new URLSearchParams();
      for (const [key, id] of Object.entries(SHARE_FIELDS)) {
        const v = document.getElementById(id).value.trim();
        if (v !== '') p.set(key, v);
      }
      p.set('u', currentUnit);
      p.set('fh', document.getElementById('firstHeightMode').value);
      if (facingPages) p.set('spread', '1');
      return location.origin + location.pathname + '#' + p.toString();
    }

    function applyShareUrl() {
      if (!location.hash || location.hash.length < 2) return false;
      const p = new URLSearchParams(location.hash.slice(1));
      if ([...p.keys()].length === 0) return false;

      if (p.get('u') === 'mm' || p.get('u') === 'px') {
        currentUnit = p.get('u');
        document.querySelectorAll('#unitToggle .pill').forEach(el => {
          el.classList.toggle('is-active', el.dataset.value === currentUnit);
        });
      }
      for (const [key, id] of Object.entries(SHARE_FIELDS)) {
        if (p.has(key)) document.getElementById(id).value = p.get(key);
      }
      const fh = p.get('fh');
      if (fh === 'leading' || fh === 'xheight' || fh === 'capheight') {
        document.getElementById('firstHeightMode').value = fh;
      }
      facingPages = p.get('spread') === '1';
      document.querySelectorAll('#facingToggle .pill').forEach(el => {
        el.classList.toggle('is-active', el.dataset.value === (facingPages ? 'spread' : 'single'));
      });
      updateMarginLabels();
      return true;
    }

    document.getElementById('shareLink').addEventListener('click', async () => {
      const btn = document.getElementById('shareLink');
      const label = btn.querySelector('span');
      try {
        await navigator.clipboard.writeText(buildShareUrl());
        label.textContent = t('btn_shared');
        setTimeout(() => { label.textContent = t('btn_share'); }, 2000);
      } catch (e) {
        // Schowek bywa niedostępny poza https — wtedy przynajmniej pokaż link w pasku adresu.
        location.hash = buildShareUrl().split('#')[1];
      }
    });

    /* ========================================
       ROZDZIAŁY: zwijanie i podsumowania
       Zwinięty rozdział pokazuje w nagłówku to, co w nim ustawiono —
       wzorzec .group__summary z edytora brandmanuala.
    ======================================== */
    const groupOpen = { document: true, type: true, grid: true, preview: true };

    function applyGroupState() {
      document.querySelectorAll('.group[data-group]').forEach(g => {
        const open = groupOpen[g.dataset.group] !== false;
        g.classList.toggle('is-open', open);
        g.querySelector('.group__head').setAttribute('aria-expanded', String(open));
      });
    }

    function updateGroupSummaries() {
      const u = currentUnit;
      const num = id => readDecimalInput(id, 0).toFixed(2);
      const fmt = [...document.querySelectorAll('#formatToggle .pill.is-active')]
        .map(p => p.textContent.trim())[0];

      const set = (slug, text) => {
        const el = document.getElementById('sum-' + slug);
        if (el) el.textContent = text;
      };

      set('document', [fmt, `${num('pageWidth')} × ${num('pageHeight')} ${u}`,
                       facingPages ? t('fh_spread_short') : null].filter(Boolean).join(' · '));

      const modeKey = { leading: 'fh_leading', xheight: 'fh_xheight', capheight: 'fh_capheight' }[
        document.getElementById('firstHeightMode').value];
      const fontLabel = document.getElementById('fontName').textContent.trim();
      set('type', `${num('fontSize')} pt / ${num('lineHeight')} · ${t(modeKey)} · ${fontLabel}`);

      const cols = document.getElementById('columns').value || '1';
      const mods = document.getElementById('hModules').value || '1';
      set('grid', `${cols} × ${mods}`);

      const on = [];
      if (document.getElementById('showGuides').checked) on.push(t('show_guides'));
      if (document.getElementById('showSpecimen').checked) on.push(t('show_specimen'));
      set('preview', on.length ? on.join(' · ') : t('preview_none'));
    }

    document.querySelectorAll('.group[data-group] .group__head').forEach(head => {
      head.addEventListener('click', () => {
        const slug = head.closest('.group').dataset.group;
        groupOpen[slug] = !(groupOpen[slug] !== false);
        applyGroupState();
        saveState();
      });
    });

    loadState();
    if (applyShareUrl()) saveState();
    updateFormatPills();
    applyGroupState();

    /* Wklejenie linku przy otwartej aplikacji zmienia sam fragment adresu,
       a to nie przeładowuje strony — bez tego nic by się nie wydarzyło. */
    addEventListener('hashchange', () => {
      if (applyShareUrl()) {
        updateFormatPills();
        recalcAndDraw();
        saveState();
      }
    });

    /* ========================================
       MOBILE PANEL TOGGLE (slider)
    ======================================== */
    (function initMobilePanelToggle() {
      const toggle = document.getElementById('mobilePanelToggle');
      const wrapper = document.getElementById('panelsWrapper');
      if (!toggle || !wrapper) return;

      toggle.addEventListener('click', e => {
        const pill = e.target.closest('.pill-wide');
        if (!pill) return;
        toggle.querySelectorAll('.pill-wide').forEach(p => p.classList.remove('is-active'));
        pill.classList.add('is-active');
        const panel = pill.dataset.panel;
        if (panel === 'results') {
          const target = wrapper.querySelector('.panel-scroll--results');
          if (target) wrapper.scrollTo({ left: target.offsetLeft - wrapper.offsetLeft, behavior: 'smooth' });
        } else {
          wrapper.scrollTo({ left: 0, behavior: 'smooth' });
        }
      });

      // Sync pill state on scroll end
      let scrollTimer;
      wrapper.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const half = wrapper.scrollWidth / 2;
          const isResults = wrapper.scrollLeft > half * 0.4;
          toggle.querySelectorAll('.pill-wide').forEach(p => {
            const isActive = isResults ? p.dataset.panel === 'results' : p.dataset.panel === 'params';
            p.classList.toggle('is-active', isActive);
          });
        }, 100);
      }, { passive: true });
    })();

    /* ========================================
       GRID CALCULATION LOGIC
    ======================================== */
    function computeMaxHModules(availableHeight, fontSizeConverted) {
      const maxRows = Math.floor(availableHeight / (fontSizeConverted * 1.0));
      const maxM = Math.floor((maxRows + 1) / 4);
      return Math.max(maxM, 1);
    }

    function fitRowsToHorizontalModules(baseRows, modules, availableHeight, fontSizeConverted) {
      const M = Math.max(parseInt(modules, 10) || 1, 1);
      if (M <= 1) return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };

      const minTextRowsPerModule = 3;
      const minRows = (M * minTextRowsPerModule) + (M - 1);
      const maxRows = Math.floor(availableHeight / (fontSizeConverted * 1.0));

      if (maxRows < minRows) return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };

      const isValid = (rows) => {
        if (!Number.isFinite(rows) || rows < minRows || rows > maxRows) return false;
        const textRows = rows - (M - 1);
        return textRows >= M * minTextRowsPerModule && (textRows % M) === 0;
      };

      const maxOffset = Math.max(baseRows - minRows, maxRows - baseRows);
      for (let off = 0; off <= maxOffset; off++) {
        for (const candidate of [baseRows - off, baseRows + off]) {
          if (isValid(candidate)) {
            return { nRows: candidate, rowsPerModule: (candidate - (M - 1)) / M, hasModules: true };
          }
        }
      }
      return { nRows: baseRows, rowsPerModule: baseRows, hasModules: false };
    }

    function getHorizontalModuleGapRowIndices(modules, rowsPerModule) {
      const M = Math.max(parseInt(modules, 10) || 1, 1);
      if (M <= 1) return [];
      const gaps = [];
      for (let m = 0; m < M - 1; m++) {
        gaps.push((m + 1) * rowsPerModule + m);
      }
      return gaps;
    }

    /* ----------------------------------------
       Jedno miejsce, w którym liczy się siatka.
       Czysta funkcja: te same wejścia dają ten sam wynik.
       Korzystają z niej tabela wyników, podgląd i eksport SVG —
       wcześniej każde z nich liczyło po swojemu.
    ---------------------------------------- */
    /* Wysokość X i wersalika czytamy z kroju. Pomiar na dużym stopniu —
       przy 8 px hinting i zaokrąglenie rastra dają błąd rzędu procentów,
       a tu z tej wartości wychodzi pierwsza wysokość całej siatki. */
    const LOREM = ('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor '
      + 'incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud '
      + 'exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure '
      + 'in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint '
      + 'occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum').split(' ');

    const GRID_FONT = 'Fragment Mono';
    const FALLBACK_METRICS = { xRatio: 0.52, capRatio: 0.70, measured: false };
    let gridFontFamily = GRID_FONT;
    let fontFromTables = false;
    /* Wgrany krój rejestrujemy pod własną nazwą wewnętrzną. Plik potrafi zgłosić
       tę samą rodzinę co krój wbudowany — wtedy nadpisałby go w document.fonts
       razem z metrykami i nie dałoby się go już odpiąć. */
    let customFace = null;
    let customSeq = 0;
    const metricsCache = new Map();

    /* Metryki z pliku: sfnt (ttf/otf) trzyma wysokość X i wersalika w tablicy OS/2
       od wersji 2. To wartości od projektanta kroju, dokładniejsze niż pomiar rysunku.
       WOFF/WOFF2 są spakowane i tu nie wejdą — dla nich zostaje pomiar znaków. */
    function readFontTables(buffer) {
      const out = { family: '', unitsPerEm: 0, sxHeight: 0, sCapHeight: 0 };
      try {
        const dv = new DataView(buffer);
        const tag = dv.getUint32(0);
        if (tag !== 0x00010000 && tag !== 0x4F54544F && tag !== 0x74727565) return out;
        const count = dv.getUint16(4), tables = {};
        for (let i = 0; i < count; i++) {
          const o = 12 + i * 16;
          const name = String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
          tables[name] = dv.getUint32(o + 8);
        }
        if (tables.head != null) out.unitsPerEm = dv.getUint16(tables.head + 18);
        if (tables['OS/2'] != null && dv.getUint16(tables['OS/2']) >= 2) {
          out.sxHeight = dv.getInt16(tables['OS/2'] + 86);
          out.sCapHeight = dv.getInt16(tables['OS/2'] + 88);
        }
        if (tables.name != null) {
          const t = tables.name, n = dv.getUint16(t + 2), strOff = t + dv.getUint16(t + 4), names = {};
          for (let i = 0; i < n; i++) {
            const r = t + 6 + i * 12, pid = dv.getUint16(r), id = dv.getUint16(r + 6);
            const len = dv.getUint16(r + 8), off = strOff + dv.getUint16(r + 10);
            if ((id !== 1 && id !== 16) || (names[id] && pid !== 3)) continue;
            let str = '';
            if (pid === 3 || pid === 0) for (let k = 0; k < len; k += 2) str += String.fromCharCode(dv.getUint16(off + k));
            else for (let k = 0; k < len; k++) str += String.fromCharCode(dv.getUint8(off + k));
            names[id] = str;
          }
          out.family = names[16] || names[1] || '';
        }
      } catch (e) {}
      return out;
    }

    function measureFontMetrics(family) {
      if (metricsCache.has(family)) return metricsCache.get(family);
      let m = Object.assign({}, FALLBACK_METRICS);
      try {
        const ctx = document.createElement('canvas').getContext('2d');
        const SIZE = 1000;
        ctx.font = SIZE + 'px "' + family + '"';
        const x = ctx.measureText('x').actualBoundingBoxAscent;
        const h = ctx.measureText('H').actualBoundingBoxAscent;
        if (Number.isFinite(x) && x > 0 && Number.isFinite(h) && h > 0) {
          m = { xRatio: x / SIZE, capRatio: h / SIZE, measured: true };
        }
      } catch (e) {}
      metricsCache.set(family, m);
      return m;
    }

    /* Krój użytkownika żyje tylko w tej sesji — plik nigdzie nie jest zapisywany. */
    async function loadFontFile(file) {
      const buf = await file.arrayBuffer();
      const tables = readFontTables(buf);
      const base = file.name.replace(/\.[^.]+$/, '');
      const label = (tables.family || base || 'Krój użytkownika').trim();
      const internal = 'kh-upload-' + (++customSeq);

      const face = new FontFace(internal, buf);
      await face.load();
      document.fonts.add(face);
      if (customFace) document.fonts.delete(customFace);
      customFace = face;

      let fromTables = false;
      if (tables.unitsPerEm > 0 && tables.sxHeight > 0 && tables.sCapHeight > 0) {
        metricsCache.set(internal, {
          xRatio: tables.sxHeight / tables.unitsPerEm,
          capRatio: tables.sCapHeight / tables.unitsPerEm,
          measured: true
        });
        fromTables = true;
      }

      gridFontFamily = internal;
      fontFromTables = fromTables;
      return { family: label, fromTables };
    }

    function readGridInputs() {
      const unit = currentUnit;
      const hModulesEl = document.getElementById('hModules');
      const gutterEl = document.getElementById('gutterWidth');
      return {
        unit,
        conversionFactor: (unit === "mm") ? 0.3528 : 1.3333,
        pageWidth: readDecimalInput('pageWidth', 0),
        pageHeight: readDecimalInput('pageHeight', 0),
        marginTop: readDecimalInput('marginTop', 0),
        marginBottom: readDecimalInput('marginBottom', 0),
        marginLeft: readDecimalInput('marginLeft', 0),
        marginRight: readDecimalInput('marginRight', 0),
        fontSizePt: readDecimalInput('fontSize', 8),
        lineHeightMult: readDecimalInput('lineHeight', 1.2),
        columnsInput: document.getElementById('columns').value,
        hModulesInput: hModulesEl ? String(hModulesEl.value).trim() : "",
        gutterRaw: gutterEl ? normalizeNumberString(gutterEl.value) : '',
        firstHeightMode: document.getElementById('firstHeightMode').value,
        showGuides: document.getElementById('showGuides').checked,
        metrics: measureFontMetrics(gridFontFamily)
      };
    }

    function computeGrid(p) {
      const fontSizeConverted = p.fontSizePt * p.conversionFactor;
      const availableWidth = p.pageWidth - (p.marginLeft + p.marginRight);
      const availableHeight = p.pageHeight - (p.marginTop + p.marginBottom);

      // Moduły poziome: wartość z pola, ograniczona tym, co mieści się na stronie.
      const maxHModules = computeMaxHModules(availableHeight, fontSizeConverted);
      const hasModulesInput = p.hModulesInput !== "";
      let modulesCount = hasModulesInput ? Math.max(parseInt(p.hModulesInput, 10) || 1, 1) : 1;
      let modulesClamped = false;
      if (hasModulesInput && modulesCount > maxHModules) {
        modulesCount = lastValidHModules;
        modulesClamped = true;
      }

      /* Pierwsza wysokość: odcinek od górnego marginesu do pierwszej linii pisma.
         W trybie „interlinia" jest równy interlinii i siatka jest jednorodna.
         W trybie X / wersalik pierwsza linia pisma siada tą wysokością pod
         marginesem, a każdy kolejny odstęp to już interlinia:
             dostępna wysokość = pierwsza wysokość + (n - 1) * interlinia      */
      const mode = (p.firstHeightMode === 'xheight' || p.firstHeightMode === 'capheight')
        ? p.firstHeightMode : 'leading';
      const xHeight = p.fontSizePt * p.metrics.xRatio * p.conversionFactor;
      const capHeight = p.fontSizePt * p.metrics.capRatio * p.conversionFactor;
      let firstHeight = mode === 'xheight' ? xHeight : (mode === 'capheight' ? capHeight : 0);
      // Pierwsza wysokość większa od kolumny tekstu (albo zerowa) nie da siatki — wracamy do interlinii.
      const firstHeightFallback = mode !== 'leading' && !(firstHeight > 0 && firstHeight < availableHeight);
      const usesFirstHeight = mode !== 'leading' && !firstHeightFallback;
      if (!usesFirstHeight) firstHeight = 0;

      let nRowsBase = usesFirstHeight
        ? 1 + Math.floor((availableHeight - firstHeight) / (fontSizeConverted * p.lineHeightMult))
        : Math.floor(availableHeight / (fontSizeConverted * p.lineHeightMult));
      if (nRowsBase < 1) nRowsBase = 1;
      if (usesFirstHeight && nRowsBase < 2) nRowsBase = 2; // inaczej dzielenie przez (n - 1) = 0

      const fit = fitRowsToHorizontalModules(nRowsBase, modulesCount, availableHeight, fontSizeConverted);
      const nRows = fit.nRows;
      const rowsPerModule = fit.hasModules ? fit.rowsPerModule : null;

      const splitRows = usesFirstHeight && nRows > 1;
      const baselineSpacing = splitRows
        ? (availableHeight - firstHeight) / (nRows - 1)
        : availableHeight / nRows;
      const firstGap = splitRows ? firstHeight : baselineSpacing;
      const baselineSpacingPt = baselineSpacing / p.conversionFactor;

      /* Pozycje linii względem górnego marginesu — jedno źródło dla podglądu i SVG.
         Przy jednorodnej siatce firstGap == baselineSpacing, więc wychodzi i * odstęp. */
      const rowY = [0];
      for (let i = 1; i <= nRows; i++) {
        // Siatka jednorodna liczona jak dotąd (i * odstęp) — inaczej suma
        // firstGap + (i-1)*odstęp różni się na ostatnim bicie i rusza współrzędne w SVG.
        rowY.push(splitRows ? firstGap + (i - 1) * baselineSpacing : i * baselineSpacing);
      }
      // Wysokość pola wiersza — przy jednorodnej siatce wprost interlinia, z tego samego powodu.
      const rowH = [];
      for (let i = 0; i < nRows; i++) rowH.push(splitRows ? rowY[i + 1] - rowY[i] : baselineSpacing);
      const gapRowIndices = fit.hasModules ? getHorizontalModuleGapRowIndices(modulesCount, rowsPerModule) : [];

      // Światło międzykolumnowe: wartość własna albo interlinia.
      const gutterCustom = parseFloat(p.gutterRaw);
      const gutterAuto = !(p.gutterRaw !== '' && Number.isFinite(gutterCustom) && gutterCustom >= 0);
      const gutterSpacing = gutterAuto ? baselineSpacing : gutterCustom;

      // Kolumny: wartość z pola albo wyliczona ze stopnia pisma.
      const columnsAuto = p.columnsInput === "";
      let nColumns;
      if (!columnsAuto) {
        nColumns = Math.max(parseInt(p.columnsInput, 10), 1);
      } else if (p.fontSizePt <= 8) {
        nColumns = 4;
      } else {
        nColumns = Math.max(Math.floor(availableWidth / (fontSizeConverted * 5)), 1);
      }

      const columnWidth = (availableWidth - (nColumns - 1) * gutterSpacing) / nColumns;
      const realLhCoeff = fontSizeConverted > 0 ? baselineSpacing / fontSizeConverted : p.lineHeightMult;

      return {
        fontSizeConverted, availableWidth, availableHeight,
        maxHModules, modulesCount, modulesClamped, hasModulesInput,
        nRowsBase, nRows, rowsPerModule, hasModules: fit.hasModules,
        baselineSpacing, baselineSpacingPt, gapRowIndices, rowY, rowH,
        mode, firstGap, firstGapPt: firstGap / p.conversionFactor,
        xHeight, capHeight,
        xHeightPt: p.fontSizePt * p.metrics.xRatio,
        capHeightPt: p.fontSizePt * p.metrics.capRatio,
        usesFirstHeight, firstHeightFallback, metricsMeasured: p.metrics.measured,
        showGuides: p.showGuides && usesFirstHeight,
        gutterSpacing, gutterAuto, nColumns, columnsAuto, columnWidth, realLhCoeff
      };
    }


    /* ========================================
       UPDATE ± BUTTON STATES
    ======================================== */
    function updateCtrlBtnStates() {
      document.querySelectorAll('.ctrl-btn').forEach(btn => {
        const targetId = btn.dataset.target;
        const dir = parseInt(btn.dataset.dir, 10);
        const el = document.getElementById(targetId);
        if (!el) return;

        let inactive = false;
        if (el.dataset.int) {
          const v = parseInt(el.value, 10) || 0;
          const min = parseInt(el.dataset.min || '1', 10);
          if (dir === -1 && v <= min) inactive = true;
          if (dir === 1 && targetId === 'hModules') {
            const unit = currentUnit;
            const cf = (unit === 'mm') ? 0.3528 : 1.3333;
            const fsc = readDecimalInput('fontSize', 8) * cf;
            const ah = readDecimalInput('pageHeight', 0) - readDecimalInput('marginTop', 0) - readDecimalInput('marginBottom', 0);
            const maxM = computeMaxHModules(ah, fsc);
            if (v >= maxM) inactive = true;
          }
        } else {
          const v = parseFloat(normalizeNumberString(el.value));
          const min = parseFloat(el.dataset.min ?? '0');
          if (dir === -1 && v <= min + 0.05) inactive = true;
        }

        btn.classList.toggle('is-inactive', inactive);
      });
    }

    /* ========================================
       COPY TO CLIPBOARD
    ======================================== */
    function copyValue(rowEl, value) {
      navigator.clipboard.writeText(value).then(() => {
        const tooltip = rowEl.querySelector('.copy-tooltip');
        if (!tooltip) return;
        tooltip.textContent = t('copied');
        rowEl.classList.add('is-just-copied');

        setTimeout(() => {
          rowEl.classList.remove('is-just-copied');
          rowEl.classList.add('is-copied');
          const reset = () => {
            tooltip.textContent = t('copy');
            rowEl.classList.remove('is-copied');
          };
          // On pointer devices: wait for mouse leave then re-enter
          const isTouch = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
          if (isTouch) {
            // On touch: just reset after a short delay
            setTimeout(reset, 500);
          } else {
            const onLeave = () => {
              rowEl.addEventListener('mouseenter', () => reset(), { once: true });
            };
            rowEl.addEventListener('mouseleave', onLeave, { once: true });
          }
        }, 2000);
      });
    }

    /* ========================================
       RECALC AND DRAW
    ======================================== */
    function recalcAndDraw() {
      const p = readGridInputs();
      const g = computeGrid(p);

      const unit = p.unit;
      const pageWidth = p.pageWidth;
      const pageHeight = p.pageHeight;
      const marginTop = p.marginTop;
      const marginBottom = p.marginBottom;
      const marginLeft = p.marginLeft;
      const marginRight = p.marginRight;
      const fixedFontSizePt = p.fontSizePt;
      const hModulesInput = p.hModulesInput;

      const fontSizeConverted = g.fontSizeConverted;
      const availableWidthVal = g.availableWidth;
      const modulesCount = g.modulesCount;
      const nRowsBase = g.nRowsBase;
      const nRows = g.nRows;
      const rowsPerModule = g.rowsPerModule;
      const optimalBaselineSpacing = g.baselineSpacing;
      const optimalBaselineSpacingPt = g.baselineSpacingPt;
      const gapRowIndices = g.gapRowIndices;
      const gutterSpacing = g.gutterSpacing;
      const nColumns = g.nColumns;
      const columnWidth = g.columnWidth;
      const realLhCoeff = g.realLhCoeff;
      const rowY = g.rowY;
      const rowH = g.rowH;
      const firstGap = g.firstGap;
      const showGuides = g.showGuides;
      const showSpecimen = document.getElementById('showSpecimen').checked;

      // Wynik z powrotem do pól — jedyne miejsce, w którym liczenie dotyka formularza.
      const hModulesEl = document.getElementById('hModules');
      if (hModulesEl && g.modulesClamped) hModulesEl.value = String(modulesCount);
      lastValidHModules = g.hasModulesInput ? modulesCount : 1;
      if (g.columnsAuto) document.getElementById('columns').value = nColumns;
      const gutterEl = document.getElementById('gutterWidth');
      if (gutterEl) gutterEl.placeholder = optimalBaselineSpacing.toFixed(2);

      // ===== BUILD RESULTS TABLE =====
      const ptUnit = t('unit_pt'); // pkt or pt
      const showInPt = (currentOutputUnit === 'pt');

      function fmtVal(valuePt, valueUnit) {
        if (showInPt) return `${valuePt.toFixed(2)} ${ptUnit}`;
        return `${valueUnit.toFixed(2)} ${unit}`;
      }

      const rows = [
        { key: 'r_baseline_rows', val: String(nRows) },
        { key: 'r_font_size', val: fmtVal(fixedFontSizePt, fontSizeConverted), copyable: true, copyVal: fmtVal(fixedFontSizePt, fontSizeConverted) },
        { key: 'r_leading', val: fmtVal(optimalBaselineSpacingPt, optimalBaselineSpacing), copyable: true, copyVal: fmtVal(optimalBaselineSpacingPt, optimalBaselineSpacing) },
        { key: 'r_lh_coeff', val: realLhCoeff.toFixed(2) },
        { key: 'r_first_height', val: fmtVal(g.firstGapPt, firstGap) + (g.firstHeightFallback ? ' *' : '') },
        { key: 'r_x_height', val: fmtVal(g.xHeightPt, g.xHeight) },
        { key: 'r_cap_height', val: fmtVal(g.capHeightPt, g.capHeight) },
        { key: 'r_font_source', val: fontFromTables ? t('src_metrics') : t('src_measured') },
        { key: 'r_h_modules', val: String(hModulesInput !== "" ? modulesCount : 1) },
        { key: 'r_rows_per_mod', val: rowsPerModule !== null ? String(rowsPerModule) : '-' },
        { key: 'r_baseline_adj', val: nRows + (nRowsBase !== nRows ? ` (${nRowsBase})` : '') },
        { key: 'r_columns', val: String(nColumns) },
        { key: 'r_col_width', val: `${columnWidth.toFixed(2)} ${unit}` },
        { key: 'r_gutter', val: `${gutterSpacing.toFixed(2)} ${unit}` },
        { key: 'r_page_w', val: `${pageWidth.toFixed(2)} ${unit}` },
        { key: 'r_page_h', val: `${pageHeight.toFixed(2)} ${unit}` },
        { key: 'r_margin_t', val: `${marginTop.toFixed(2)} ${unit}` },
        { key: 'r_margin_b', val: `${marginBottom.toFixed(2)} ${unit}` },
        { key: facingPages ? 'r_margin_inner' : 'r_margin_l', val: `${marginLeft.toFixed(2)} ${unit}` },
        { key: facingPages ? 'r_margin_outer' : 'r_margin_r', val: `${marginRight.toFixed(2)} ${unit}` },
      ];

      const tableEl = document.getElementById('resultsTable');
      tableEl.innerHTML = rows.map(r => {
        const cls = r.copyable ? ' is-copyable' : '';
        const tooltip = r.copyable ? `<span class="copy-tooltip">${t('copy')}</span>` : '';
        return `<div class="result-row${cls}" ${r.copyable ? `data-copy-val="${r.copyVal}"` : ''}>
          <span>${t(r.key)}</span>
          <span class="result-value">${r.val}</span>
          ${tooltip}
        </div>`;
      }).join('');

      // Attach copy handlers
      tableEl.querySelectorAll('.is-copyable').forEach(row => {
        row.addEventListener('click', () => copyValue(row, row.dataset.copyVal));
      });

      // ===== DRAW CANVAS =====
      const canvas = document.getElementById('gridCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.querySelector('.canvas-wrap');
      const contentWidth = container.clientWidth;
      const contentHeight = container.clientHeight;

      if (contentWidth <= 0 || contentHeight <= 0) return;

      // Helper: draw one page's grid at offset xOff with given left/right margins
      function drawPageGrid(ctx, scale, xOff, pw, ph, mLeft, mRight, mTop, mBottom) {
        const aw = pw - (mLeft + mRight);
        const ah = ph - (mTop + mBottom);

        // Page background
        ctx.fillStyle = '#fff';
        ctx.fillRect(xOff, 0, pw, ph);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1 / scale;
        ctx.strokeRect(xOff, 0, pw, ph);

        // Margin area
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1 / scale;
        ctx.strokeRect(xOff + mLeft, mTop, aw, ah);

        // Module gap rows
        if (gapRowIndices.length > 0) {
          ctx.fillStyle = 'rgba(17,59,183,0.2)';
          for (const rowIdx of gapRowIndices) {
            const yGap = mTop + rowY[rowIdx];
            ctx.fillRect(xOff + mLeft, yGap, aw, rowH[rowIdx]);
          }
        }

        // Baseline rows
        ctx.strokeStyle = '#DE4343';
        ctx.lineWidth = 1 / scale;
        for (let i = 0; i <= nRows; i++) {
          const y = mTop + rowY[i];
          ctx.beginPath();
          ctx.moveTo(xOff + mLeft, y);
          ctx.lineTo(xOff + mLeft + aw, y);
          ctx.stroke();
        }

        // Linie pomocnicze: wysokość X / wersalika nad każdą linią pisma
        if (showGuides) {
          ctx.strokeStyle = '#B25C00';
          ctx.lineWidth = 1 / scale;
          for (let i = 1; i <= nRows; i++) {
            const y = mTop + rowY[i] - firstGap;
            ctx.beginPath();
            ctx.moveTo(xOff + mLeft, y);
            ctx.lineTo(xOff + mLeft + aw, y);
            ctx.stroke();
          }
        }

        // Gutter fills
        ctx.fillStyle = 'rgba(222,67,67,0.2)';
        for (let i = 1; i < nColumns; i++) {
          const gutterLeft = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          ctx.fillRect(gutterLeft, mTop, gutterSpacing, ah);
        }

        // Column lines
        ctx.strokeStyle = '#DE4343';
        ctx.lineWidth = 1 / scale;
        for (let i = 0; i <= nColumns; i++) {
          let x;
          if (i === 0) x = xOff + mLeft;
          else if (i === nColumns) x = xOff + mLeft + aw;
          else x = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          ctx.beginPath();
          ctx.moveTo(x, mTop);
          ctx.lineTo(x, mTop + ah);
          ctx.stroke();
        }

        // Podgląd treści: lorem ipsum na liniach pisma, w wybranym kroju
        if (showSpecimen && fontSizeConverted > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(17, 17, 17, 0.8)';
          ctx.font = fontSizeConverted + 'px "' + gridFontFamily + '"';
          ctx.textBaseline = 'alphabetic';
          let w = 0;
          for (let col = 0; col < nColumns; col++) {
            const x0 = xOff + mLeft + col * (columnWidth + gutterSpacing);
            ctx.save();
            /* Pionowo przycinamy do strony, nie do kolumny tekstu: wydłużenia górne
               pierwszego wiersza i dolne ostatniego wychodzą poza blok tekstu i mają
               prawo być widoczne — zwłaszcza w trybie wysokości X, gdzie wersaliki
               pierwszego wiersza siedzą nad górnym marginesem. */
            ctx.beginPath();
            ctx.rect(x0, 0, columnWidth, ph);
            ctx.clip();
            for (let i = 1; i <= nRows; i++) {
              if (gapRowIndices.indexOf(i - 1) !== -1) continue; // puste pole między modułami
              let line = '';
              for (let guard = 0; guard < 64; guard++) {
                const word = LOREM[w % LOREM.length];
                const probe = line ? line + ' ' + word : word;
                if (line && ctx.measureText(probe).width > columnWidth) break;
                line = probe;
                w++;
                if (ctx.measureText(line).width > columnWidth) break;
              }
              ctx.fillText(line, x0, mTop + rowY[i]);
            }
            ctx.restore();
          }
          ctx.restore();
        }
      }

      const totalWidth = facingPages ? pageWidth * 2 : pageWidth;
      const fitScale = Math.min(contentWidth / totalWidth, contentHeight / pageHeight);
      const minScale = Math.max(120 / totalWidth, 200 / pageHeight);
      const scale = Math.max(fitScale, minScale) * previewZoom;

      canvas.width = Math.max(1, Math.round(totalWidth * scale));
      canvas.height = Math.max(1, Math.round(pageHeight * scale));
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(scale, scale);

      if (facingPages) {
        // Left page: outer=marginRight, inner=marginLeft
        drawPageGrid(ctx, scale, 0, pageWidth, pageHeight, marginRight, marginLeft, marginTop, marginBottom);
        // Right page: inner=marginLeft, outer=marginRight
        drawPageGrid(ctx, scale, pageWidth, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
        // Spine line
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5 / scale;
        ctx.beginPath();
        ctx.moveTo(pageWidth, 0);
        ctx.lineTo(pageWidth, pageHeight);
        ctx.stroke();
      } else {
        drawPageGrid(ctx, scale, 0, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
      }

      ctx.restore();
      container.classList.toggle('is-zoomed',
        canvas.width > contentWidth + 1 || canvas.height > contentHeight + 1);
      updateCtrlBtnStates();
      updateFormatPills();
      updateGroupSummaries();
      saveState();
    }

    /* ========================================
       DOWNLOAD SVG
    ======================================== */
    function downloadSVG() {
      const p = readGridInputs();
      const g = computeGrid(p);

      const unit = p.unit;
      const pageWidth = p.pageWidth;
      const pageHeight = p.pageHeight;
      const marginTop = p.marginTop;
      const marginBottom = p.marginBottom;
      const marginLeft = p.marginLeft;
      const marginRight = p.marginRight;

      const nRows = g.nRows;
      const optimalBaselineSpacing = g.baselineSpacing;
      const gapRowIndices = g.gapRowIndices;
      const gutterSpacing = g.gutterSpacing;
      const nColumns = g.nColumns;
      const columnWidth = g.columnWidth;
      const rowY = g.rowY;
      const rowH = g.rowH;
      const firstGap = g.firstGap;
      const showGuides = g.showGuides;

      // Helper: generate SVG elements for one page at xOffset
      function svgPageGrid(xOff, pw, ph, mLeft, mRight, mTop, mBottom) {
        const aw = pw - (mLeft + mRight);
        const ah = ph - (mTop + mBottom);
        let s = '';
        s += `<rect x="${xOff}" y="0" width="${pw}" height="${ph}" fill="none" stroke="#000" stroke-width="0.25"/>`;
        s += `<rect x="${xOff + mLeft}" y="${mTop}" width="${aw}" height="${ah}" fill="none" stroke="#aaa" stroke-width="0.25"/>`;

        if (gapRowIndices.length > 0) {
          for (const rowIdx of gapRowIndices) {
            const yGap = mTop + rowY[rowIdx];
            s += `<rect x="${xOff + mLeft}" y="${yGap}" width="${aw}" height="${rowH[rowIdx]}" fill="#113BB7" fill-opacity="0.2"/>`;
          }
        }

        for (let i = 0; i <= nRows; i++) {
          const y = mTop + rowY[i];
          s += `<line x1="${xOff + mLeft}" y1="${y}" x2="${xOff + mLeft + aw}" y2="${y}" stroke="#DE4343" stroke-width="0.25"/>`;
        }

        if (showGuides) {
          for (let i = 1; i <= nRows; i++) {
            const y = mTop + rowY[i] - firstGap;
            s += `<line x1="${xOff + mLeft}" y1="${y}" x2="${xOff + mLeft + aw}" y2="${y}" stroke="#B25C00" stroke-width="0.25"/>`;
          }
        }

        for (let i = 1; i < nColumns; i++) {
          const gutterLeft = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          s += `<rect x="${gutterLeft}" y="${mTop}" width="${gutterSpacing}" height="${ah}" fill="#DE4343" fill-opacity="0.2"/>`;
        }

        for (let i = 0; i <= nColumns; i++) {
          let x;
          if (i === 0) x = xOff + mLeft;
          else if (i === nColumns) x = xOff + mLeft + aw;
          else x = xOff + mLeft + i * columnWidth + (i - 1) * gutterSpacing;
          s += `<line x1="${x}" y1="${mTop}" x2="${x}" y2="${mTop + ah}" stroke="#DE4343" stroke-width="0.25"/>`;
        }
        return s;
      }

      const totalW = facingPages ? pageWidth * 2 : pageWidth;
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}${unit}" height="${pageHeight}${unit}" viewBox="0 0 ${totalW} ${pageHeight}">`;

      if (facingPages) {
        svg += svgPageGrid(0, pageWidth, pageHeight, marginRight, marginLeft, marginTop, marginBottom);
        svg += svgPageGrid(pageWidth, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
        svg += `<line x1="${pageWidth}" y1="0" x2="${pageWidth}" y2="${pageHeight}" stroke="#000" stroke-width="0.5"/>`;
      } else {
        svg += svgPageGrid(0, pageWidth, pageHeight, marginLeft, marginRight, marginTop, marginBottom);
      }

      svg += `</svg>`;

      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = facingPages ? 'siatka-rozkladowka.svg' : 'siatka.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* ========================================
       NOWA WERSJA NA SERWERZE
       Wzorzec z edytora brandmanuala: version.json obok strony,
       porównanie z wersją wbudowaną w tę kopię, pasek z prośbą
       o odświeżenie. Bez odpytywania, gdy pasek już wisi.
    ======================================== */
    const APP_VERSION = '2026.11.06.8';

    document.getElementById('topbarVersion').textContent = 'v' + APP_VERSION;

    /* Ekran ładowania schodzi, gdy kroje są gotowe i siatka narysowana —
       inaczej mignąłby tekst w zastępczym kroju. */
    /* Kolejność: podziałka się rysuje, rozsuwa, gaśnie — chwila pustego
       ekranu — dopiero wtedy wjeżdża interfejs. Nakładka ma to samo tło co
       strona, więc jej usunięcie jest niewidoczne; znikają tylko kreski.
       Dlatego nie ukrywamy .app klasą: gdyby skrypt padł, interfejs i tak
       jest na swoim miejscu, a nie schowany na zawsze. */
    const LOADER_END = 3350;   // 1,2 s rysowania + rozsuwanie + 0,45 s zaniku kresek
    const LOADER_HOLD = 400;   // pusty ekran

    (function runLoader() {
      const el = document.getElementById('loader');
      if (!el) return;
      const fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      Promise.all([fonts, new Promise(r => setTimeout(r, LOADER_END + LOADER_HOLD))]).then(() => {
        el.remove();
        const app = document.querySelector('.app');
        app.classList.add('is-loaded');
        setTimeout(() => app.classList.remove('is-loaded'), 1600);
      });
    })();

    (function watchVersion() {
      const banner = document.getElementById('updateBanner');
      if (!banner) return;
      document.getElementById('updateReload').addEventListener('click', () => location.reload());

      // Pasek łamie się na wąskim ekranie, więc wysokość mierzymy zamiast zakładać.
      const syncHeight = () => {
        document.documentElement.style.setProperty('--banner-h', banner.offsetHeight + 'px');
        recalcAndDraw(); // podgląd dostaje mniej wysokości
      };

      const check = async () => {
        if (!banner.hidden) return;
        try {
          const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return;
          const data = await r.json();
          if (data.version && data.version !== APP_VERSION) {
            banner.hidden = false;
            document.body.classList.add('has-banner');
            syncHeight();
            addEventListener('resize', syncHeight);
          }
        } catch {}
      };

      check();
      setInterval(check, 5 * 60 * 1000);
      addEventListener('focus', check);
    })();

    /* ========================================
       EVENT BINDINGS
    ======================================== */
    /* Linie pomocnicze mają sens tylko wtedy, gdy pierwsza wysokość różni się od interlinii. */
    function updateGuidesRow() {
      const row = document.getElementById('guidesRow');
      const off = document.getElementById('firstHeightMode').value === 'leading';
      row.classList.toggle('is-disabled', off);
      document.getElementById('showGuides').disabled = off;
    }

    /* Oświadczenie licencyjne odblokowuje wgranie — wzorzec z edytora brandmanuala,
       razem z datą oświadczenia. Aplikacja nie weryfikuje licencji i nie może tego robić. */
    const fontLicensed = document.getElementById('fontLicensed');
    const fontPick = document.getElementById('fontPick');
    const fontFile = document.getElementById('fontFile');
    const fontName = document.getElementById('fontName');
    const fontClear = document.getElementById('fontClear');
    const fontNote = document.getElementById('fontNote');
    let fontLicensedAt = '';

    function resetFont() {
      if (customFace) { document.fonts.delete(customFace); customFace = null; }
      gridFontFamily = GRID_FONT;
      fontFromTables = false;
      fontName.textContent = GRID_FONT;
      fontClear.hidden = true;
      fontNote.classList.remove('is-warn');
      fontNote.textContent = t('font_note');
      fontFile.value = '';
      recalcAndDraw();
      updateGroupSummaries();
    }

    fontLicensed.addEventListener('change', () => {
      fontPick.disabled = !fontLicensed.checked;
      fontLicensedAt = fontLicensed.checked ? new Date().toISOString().slice(0, 10) : '';
      if (!fontLicensed.checked && customFace) resetFont();
    });

    fontPick.addEventListener('click', () => fontFile.click());
    fontClear.addEventListener('click', resetFont);

    fontFile.addEventListener('change', async () => {
      const file = fontFile.files[0];
      if (!file) return;
      try {
        const res = await loadFontFile(file);
        fontName.textContent = res.family + (fontLicensedAt ? ' · ' + fontLicensedAt.split('-').reverse().join('.') : '');
        fontClear.hidden = false;
        fontNote.classList.remove('is-warn');
        fontNote.textContent = t(res.fromTables ? 'font_note_metrics' : 'font_note_measured');
        recalcAndDraw();
      } catch (e) {
        fontNote.classList.add('is-warn');
        fontNote.textContent = t('font_err_read');
        fontFile.value = '';
      }
    });

    document.getElementById('showSpecimen').addEventListener('change', () => { recalcAndDraw(); saveState(); });

    document.getElementById('firstHeightMode').addEventListener('change', () => {
      updateGuidesRow();
      recalcAndDraw();
      saveState();
    });
    document.getElementById('showGuides').addEventListener('change', () => { recalcAndDraw(); saveState(); });

    /* Metryki mierzone przed wczytaniem kroju pochodzą z zastępczego — przeliczamy po załadowaniu. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { metricsCache.clear(); updateGuidesRow(); recalcAndDraw(); });
    }

    document.getElementById('downloadSVG').addEventListener('click', downloadSVG);

    document.getElementById('reset').addEventListener('click', () => {
      currentUnit = 'mm';
      document.querySelectorAll('#unitToggle .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === 'mm');
      });
      document.getElementById('pageWidth').value = '210.00';
      document.getElementById('pageHeight').value = '297.00';
      document.getElementById('marginTop').value = '5.00';
      document.getElementById('marginBottom').value = '5.00';
      document.getElementById('marginLeft').value = '5.00';
      document.getElementById('marginRight').value = '5.00';
      document.getElementById('fontSize').value = '8.00';
      document.getElementById('lineHeight').value = '1.20';
      document.getElementById('columns').value = '1';
      document.getElementById('hModules').value = '1';
      document.getElementById('gutterWidth').value = '';
      document.getElementById('firstHeightMode').value = 'leading';
      document.getElementById('showGuides').checked = false;
      document.getElementById('showSpecimen').checked = false;
      updateGuidesRow();
      facingPages = false;
      document.querySelectorAll('#facingToggle .pill').forEach(p => {
        p.classList.toggle('is-active', p.dataset.value === 'single');
      });
      updateMarginLabels();
      lastValidHModules = 1;
      recalcAndDraw();
      saveState();
    });

    /* ========================================
       INIT
    ======================================== */
    window.addEventListener('load', () => {
      applyLanguage();
      recalcAndDraw();
      // Klasę is-loaded dokłada ekran ładowania, kiedy zejdzie —
      // inaczej wejście paneli odegrałoby się pod nakładką.
    });
    window.addEventListener('resize', recalcAndDraw);
  </script>
</body>
</html>
